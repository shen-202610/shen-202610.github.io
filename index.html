<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="二建分章练">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>二建机电 · 分章节刷题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --success: #34a853;
    --danger: #ea4335;
    --warning: #f9ab00;
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #202124;
    --text-secondary: #5f6368;
    --border: #e0e0e0;
    --radius: 12px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    padding-bottom: 40px;
    font-size: 15px;
  }

  /* ===== 顶部标题 ===== */
  .header {
    background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
    color: #fff;
    padding: 20px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .header .subtitle { font-size: 13px; opacity: .85; }
  .header .chapter-badge {
    display: inline-block;
    background: rgba(255,255,255,.2);
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 6px;
  }
  .header .progress-mini {
    font-size: 11px;
    opacity: 0.8;
    margin-top: 4px;
  }

  .container { max-width: 680px; margin: 0 auto; padding: 16px; }

  /* ===== 章节导航条 ===== */
  .chapter-nav {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 12px 0 8px;
    margin-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .chapter-nav::-webkit-scrollbar { display: none; }
  .chapter-tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--text-secondary);
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .chapter-tab.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .chapter-tab.locked {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .chapter-tab .lock-icon { font-size: 11px; }
  .chapter-tab .check-icon { font-size: 12px; color: var(--success); }
  .chapter-tab.active .check-icon { color: #fff; }

  /* ===== 章节信息卡 ===== */
  .chapter-info {
    background: linear-gradient(135deg, #e8f0fe 0%, #f0f7ff 100%);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
    border: 1px solid #c9daf8;
  }
  .chapter-info .ci-title { font-weight: 700; font-size: 16px; color: var(--primary-dark); margin-bottom: 6px; }
  .chapter-info .ci-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .chapter-info .ci-meta {
    display: flex;
    gap: 12px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .chapter-info .ci-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    background: #e8f0fe;
    color: var(--primary);
  }
  .chapter-info .ci-tag.pass {
    background: #e6f4ea;
    color: var(--success);
  }
  .chapter-info .ci-tag.warn {
    background: #fce8e6;
    color: var(--danger);
  }

  /* ===== 通关提示 ===== */
  .pass-banner {
    background: linear-gradient(135deg, #e6f4ea 0%, #ceead6 100%);
    border: 1px solid var(--success);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
    font-size: 14px;
    color: #137333;
    display: none;
  }
  .pass-banner.show { display: block; }
  .pass-banner .pb-title { font-weight: 700; margin-bottom: 4px; }

  .lock-banner {
    background: linear-gradient(135deg, #fce8e6 0%, #fadbd8 100%);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
    font-size: 14px;
    color: #c5221f;
    display: none;
  }
  .lock-banner.show { display: block; }

  /* ===== 进度条 ===== */
  .progress-bar {
    position: sticky;
    top: 66px;
    z-index: 99;
    background: var(--bg);
    padding: 8px 0;
    margin-bottom: 4px;
  }
  .progress-track {
    height: 6px;
    background: #e0e0e0;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1a73e8, #34a853);
    border-radius: 3px;
    transition: width .4s ease;
    width: 0%;
  }
  .progress-text {
    font-size: 12px;
    color: var(--text-secondary);
    text-align: right;
    margin-top: 4px;
  }

  /* ===== 题目卡片 ===== */
  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    border-left: 4px solid var(--primary);
  }
  .q-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .q-num {
    background: var(--primary);
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .q-type {
    font-size: 11px;
    color: var(--primary);
    border: 1px solid var(--primary);
    padding: 1px 8px;
    border-radius: 10px;
  }
  .q-kp {
    font-size: 11px;
    color: var(--text-secondary);
    background: #f5f5f5;
    padding: 1px 8px;
    border-radius: 10px;
  }
  .q-diff {
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 10px;
  }
  .q-diff.易 { background: #e6f4ea; color: var(--success); }
  .q-diff.中 { background: #fef7e0; color: #b06000; }
  .q-diff.高 { background: #fce8e6; color: var(--danger); }
  .q-text { font-size: 15px; margin-bottom: 12px; line-height: 1.8; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex;
    align-items: flex-start;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all .2s;
    font-size: 14px;
  }
  .option:active { transform: scale(.98); }
  .option.selected {
    border-color: var(--primary);
    background: #e8f0fe;
  }
  .option.correct {
    border-color: var(--success);
    background: #e6f4ea;
  }
  .option.wrong {
    border-color: var(--danger);
    background: #fce8e6;
  }
  .option-letter {
    font-weight: 700;
    margin-right: 8px;
    color: var(--primary);
    min-width: 20px;
  }
  .option.selected .option-letter,
  .option.correct .option-letter { color: inherit; }
  .option.multi.selected {
    border-color: var(--warning);
    background: #fef7e0;
  }
  .option.multi.selected.correct {
    border-color: var(--success);
    background: #e6f4ea;
  }
  .option.multi.selected.wrong {
    border-color: var(--danger);
    background: #fce8e6;
  }

  /* ===== 按钮 ===== */
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    margin-top: 8px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-primary:disabled { background: #b0bec5; cursor: not-allowed; }
  .btn-outline {
    background: transparent;
    color: var(--primary);
    border: 1.5px solid var(--primary);
  }
  .btn-success {
    background: var(--success);
    color: #fff;
  }

  /* ===== 答案区域 ===== */
  .answer-section {
    margin-top: 20px;
    display: none;
  }
  .answer-section.show { display: block; }
  .score-card {
    background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
    color: #fff;
    border-radius: var(--radius);
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .score-card .score-num {
    font-size: 48px;
    font-weight: 800;
    line-height: 1;
  }
  .score-card .score-total { font-size: 20px; opacity: .8; }
  .score-card .score-label { font-size: 14px; margin-top: 8px; opacity: .9; }
  .score-emoji { font-size: 36px; margin-bottom: 8px; }
  .score-card .pass-status {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 700;
  }
  .pass-status.passed { background: #34a853; }
  .pass-status.failed { background: #ea4335; }

  .answer-item {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .answer-item .a-title {
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .answer-item .a-title .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 600;
  }
  .tag-correct { background: #e6f4ea; color: var(--success); }
  .tag-wrong { background: #fce8e6; color: var(--danger); }
  .answer-item .a-content { font-size: 14px; line-height: 1.8; }
  .answer-item .a-content .label {
    font-weight: 700;
    color: var(--primary);
  }
  .explanation {
    background: #f8f9fa;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.7;
    border-left: 3px solid var(--primary);
  }
  .kp-tag {
    display: inline-block;
    font-size: 11px;
    color: var(--text-secondary);
    background: #f0f0f0;
    padding: 1px 6px;
    border-radius: 6px;
    margin-top: 6px;
  }

  .overall-eval {
    background: linear-gradient(135deg, #fef7e0 0%, #fff3c4 100%);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-top: 16px;
    border: 1px solid #f9ab00;
  }
  .overall-eval h3 { color: #b06000; font-size: 16px; margin-bottom: 8px; }
  .overall-eval p { font-size: 14px; line-height: 1.8; }
  .overall-eval .tip {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #f9ab00;
    font-size: 13px;
  }

  /* ===== 底部提示 ===== */
  .footer-tip {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 24px;
    padding: 16px;
    background: var(--card);
    border-radius: var(--radius);
  }
  .footer-tip .add-shortcut {
    color: var(--primary);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
  }

  /* ===== 快捷方式弹窗 ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 24px 20px;
    max-width: 340px;
    width: 90%;
    text-align: center;
  }
  .modal h3 { font-size: 17px; margin-bottom: 12px; color: var(--primary); }
  .modal p { font-size: 14px; line-height: 1.8; color: var(--text-secondary); margin-bottom: 8px; text-align: left; }
  .modal .step { margin-bottom: 10px; }
  .modal .step-num {
    display: inline-flex;
    width: 22px; height: 22px;
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .modal-close {
    margin-top: 16px;
    padding: 10px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }

  .fade-in { animation: fadeIn .5s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .highlight { background: #fff3c4; padding: 1px 3px; border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>📘 二建机电 · 分章节刷题</h1>
  <div class="subtitle" id="headerSubtitle">第一轮复习 · 按章节掌握知识点</div>
  <div class="chapter-badge" id="chapterBadge">1.1 机电工程常用材料</div>
  <div class="progress-mini" id="progressMini"></div>
</div>

<div class="container">

  <!-- 章节导航 -->
  <div class="chapter-nav" id="chapterNav"></div>

  <!-- 章节信息 -->
  <div class="chapter-info" id="chapterInfo"></div>

  <!-- 通关/锁定提示 -->
  <div class="pass-banner" id="passBanner"></div>
  <div class="lock-banner" id="lockBanner"></div>

  <!-- 进度条 -->
  <div class="progress-bar" id="progressBar">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">已完成 0 / 0 题</div>
  </div>

  <!-- 题目区域 -->
  <div id="quizArea"></div>

  <!-- 操作按钮 -->
  <button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()">✅ 提交作答并评分</button>
  <button class="btn btn-outline" id="resetBtn" onclick="resetQuiz()" style="display:none">🔄 重新作答</button>
  <button class="btn btn-success" id="nextChapterBtn" onclick="goNextChapter()" style="display:none">➡️ 进入下一章节</button>

  <!-- 答案区域 -->
  <div class="answer-section" id="answerSection"></div>

  <!-- 底部 -->
  <div class="footer-tip">
    💡 <span class="add-shortcut" onclick="showShortcutModal()">点击这里了解如何添加到手机桌面</span><br><br>
    📖 按章节系统学习，完全掌握后再进入下一章。坚持就是胜利！
  </div>
</div>

<!-- 快捷方式弹窗 -->
<div class="modal-overlay" id="shortcutModal">
  <div class="modal">
    <h3>📱 添加到手机桌面</h3>
    <div class="step"><span class="step-num">1</span>用手机浏览器（Safari / Chrome）打开本页面</div>
    <div class="step"><span class="step-num">2</span>点击浏览器底部/顶部的 <strong>「分享」</strong> 按钮</div>
    <div class="step"><span class="step-num">3</span>滑动找到并点击 <strong>「添加到主屏幕」</strong></div>
    <div class="step"><span class="step-num">4</span>可自定义名称，点击 <strong>「添加」</strong> 完成</div>
    <p style="text-align:center; margin-top:12px; font-size:12px; color:#999;">之后在桌面点图标即可直接进入刷题页面 🎯</p>
    <button class="modal-close" onclick="closeShortcutModal()">我知道了</button>
  </div>
</div>

<script src="quiz-data.js"></script>
<script>
// ============================================================
// 分章节刷题逻辑
// ============================================================

// 章节顺序定义
const chapterOrder = ["1.1"];

// 通关状态管理
function getPassStatus(chapterId) {
  return localStorage.getItem('erjian_pass_' + chapterId) === 'true';
}
function setPassStatus(chapterId, passed) {
  localStorage.setItem('erjian_pass_' + chapterId, passed ? 'true' : 'false');
}

// 当前章节
let currentChapter = null;
let userAnswers = {};
let quizSubmitted = false;

// ===== 初始化 =====
function init() {
  // 默认显示第一个未通关的章节
  const lastChapter = localStorage.getItem('erjian_current_chapter') || '1.1';
  switchChapter(lastChapter);
  renderChapterNav();
}

// ===== 渲染章节导航 =====
function renderChapterNav() {
  const nav = document.getElementById('chapterNav');
  let html = '';
  chapterOrder.forEach(cid => {
    const ch = chapterQuizData[cid];
    if (!ch) return;
    const isPassed = getPassStatus(cid);
    const isActive = currentChapter === cid;
    const isLocked = !isPassed && cid !== '1.1' && !getPassStatus(chapterOrder[chapterOrder.indexOf(cid) - 1]);

    let cls = 'chapter-tab';
    if (isActive) cls += ' active';
    if (isLocked) cls += ' locked';

    let label = cid + ' ' + ch.chapterName;
    let icons = '';
    if (isPassed) icons += ' <span class="check-icon">✓</span>';
    if (isLocked) icons += ' <span class="lock-icon">🔒</span>';

    html += `<div class="${cls}" onclick="onChapterTabClick('${cid}')">${icons}${label}</div>`;
  });
  nav.innerHTML = html;
}

function onChapterTabClick(cid) {
  const idx = chapterOrder.indexOf(cid);
  if (idx === 0) { switchChapter(cid); return; }
  const prevPassed = getPassStatus(chapterOrder[idx - 1]);
  const isPassed = getPassStatus(cid);
  if (!prevPassed && !isPassed) {
    alert('⚠️ 请先完成并通过上一章节：「' + chapterQuizData[chapterOrder[idx - 1]].chapterName + '」（得分≥80分）');
    return;
  }
  switchChapter(cid);
}

// ===== 切换章节 =====
function switchChapter(chapterId) {
  currentChapter = chapterId;
  localStorage.setItem('erjian_current_chapter', chapterId);
  const ch = chapterQuizData[chapterId];
  if (!ch) return;

  // 更新头部
  document.getElementById('chapterBadge').textContent = chapterId + ' ' + ch.chapterName;
  document.getElementById('headerSubtitle').textContent = '第一轮复习 · 按章节掌握知识点';
  document.title = '二建机电 · ' + chapterId + ' ' + ch.chapterName;

  // 章节信息
  renderChapterInfo(ch);

  // 检查是否已通关
  const isPassed = getPassStatus(chapterId);
  if (isPassed) {
    showPassBanner(ch);
  } else {
    hidePassBanner();
  }

  // 恢复作答
  userAnswers = {};
  quizSubmitted = false;
  const saved = localStorage.getItem('erjian_answers_' + chapterId);
  if (saved) {
    userAnswers = JSON.parse(saved);
  }
  const submitted = localStorage.getItem('erjian_submitted_' + chapterId);
  if (submitted === 'true') {
    quizSubmitted = true;
  }

  renderQuiz();
  renderChapterNav();
  updateProgress();

  if (quizSubmitted) {
    showAnswers(true);
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('resetBtn').style.display = 'block';
  } else {
    document.getElementById('answerSection').classList.remove('show');
    document.getElementById('submitBtn').style.display = 'block';
    document.getElementById('resetBtn').style.display = 'none';
  }

  // 隐藏下一章按钮
  document.getElementById('nextChapterBtn').style.display = 'none';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== 渲染章节信息卡 =====
function renderChapterInfo(ch) {
  const el = document.getElementById('chapterInfo');
  const isPassed = getPassStatus(ch.chapterId);
  const singleCount = ch.questions.filter(q => q.type === 'single').length;
  const multiCount = ch.questions.filter(q => q.type === 'multi').length;

  let html = '';
  html += '<div class="ci-title">📖 ' + ch.chapterName + '</div>';
  html += '<div class="ci-desc">' + ch.description + '</div>';
  html += '<div class="ci-meta">';
  html += '<span class="ci-tag">单选题 ' + singleCount + ' 题</span>';
  html += '<span class="ci-tag">多选题 ' + multiCount + ' 题</span>';
  html += '<span class="ci-tag">共 ' + ch.questions.length + ' 题</span>';
  html += '<span class="ci-tag">通关分数 ≥ ' + ch.passingScore + ' 分</span>';
  if (isPassed) {
    html += '<span class="ci-tag pass">✓ 已通关</span>';
  } else {
    html += '<span class="ci-tag warn">未通关</span>';
  }
  html += '</div>';
  el.innerHTML = html;
}

// ===== 通关/锁定横幅 =====
function showPassBanner(ch) {
  const banner = document.getElementById('passBanner');
  banner.classList.add('show');
  banner.innerHTML = '<div class="pb-title">✅ 本章已通关！</div>' +
    '你已通过「' + ch.chapterName + '」的考核（得分≥' + ch.passingScore + '分）。' +
    '你可以复习本章题目，也可以进入下一章节继续学习。';

  document.getElementById('lockBanner').classList.remove('show');
}

function hidePassBanner() {
  document.getElementById('passBanner').classList.remove('show');
}

function showLockBanner(nextChapterName) {
  const banner = document.getElementById('lockBanner');
  banner.classList.add('show');
  banner.innerHTML = '🔒 本章尚未通关（得分需≥' + chapterQuizData[currentChapter].passingScore + '分）。' +
    '请继续练习，完全掌握「' + chapterQuizData[currentChapter].chapterName + '」的知识点后，再解锁下一章节。';
}

// ===== 渲染题目 =====
function renderQuiz() {
  const ch = chapterQuizData[currentChapter];
  if (!ch) return;

  const area = document.getElementById('quizArea');
  let html = '';
  ch.questions.forEach((q, idx) => {
    html += '<div class="question-card fade-in" style="animation-delay:' + (idx * 0.05) + 's">';
    html += '<div class="q-header">';
    html += '<div class="q-num">' + (idx + 1) + '</div>';
    html += '<div class="q-type">' + q.typeLabel + '</div>';
    html += '<div class="q-kp">' + q.knowledgePoint + '</div>';
    html += '<div class="q-diff ' + q.difficulty + '">' + q.difficulty + '</div>';
    html += '</div>';
    html += '<div class="q-text">' + q.question + '</div>';
    html += '<div class="options" id="options-' + idx + '">';
    q.options.forEach((opt, optIdx) => {
      const isMulti = q.type === 'multi';
      html += '<div class="option' + (isMulti ? ' multi' : '') + '" onclick="selectOption(' + idx + ',' + optIdx + ',' + isMulti + ')">';
      html += '<span class="option-letter">' + String.fromCharCode(65 + optIdx) + '</span>';
      html += '<span>' + opt + '</span>';
      html += '</div>';
    });
    html += '</div>';
    html += '</div>';
  });
  area.innerHTML = html;

  // 恢复选择状态
  restoreSelections();
}

// ===== 选择选项 =====
function selectOption(qIdx, optIdx, isMulti) {
  if (quizSubmitted) return;
  const ch = chapterQuizData[currentChapter];
  const q = ch.questions[qIdx];

  if (isMulti) {
    if (!userAnswers[qIdx]) userAnswers[qIdx] = [];
    const pos = userAnswers[qIdx].indexOf(optIdx);
    if (pos > -1) {
      userAnswers[qIdx].splice(pos, 1);
    } else {
      userAnswers[qIdx].push(optIdx);
    }
  } else {
    userAnswers[qIdx] = optIdx;
  }
  localStorage.setItem('erjian_answers_' + currentChapter, JSON.stringify(userAnswers));
  renderSelections(qIdx);
  updateProgress();
}

function renderSelections(qIdx) {
  const ch = chapterQuizData[currentChapter];
  const q = ch.questions[qIdx];
  const container = document.getElementById('options-' + qIdx);
  if (!container) return;
  const options = container.querySelectorAll('.option');
  options.forEach((el, i) => {
    el.classList.remove('selected');
    if (q.type === 'multi') {
      if (userAnswers[qIdx] && userAnswers[qIdx].includes(i)) {
        el.classList.add('selected');
      }
    } else {
      if (userAnswers[qIdx] === i) {
        el.classList.add('selected');
      }
    }
  });
}

function restoreSelections() {
  const ch = chapterQuizData[currentChapter];
  ch.questions.forEach((q, idx) => {
    renderSelections(idx);
  });
}

// ===== 进度 =====
function updateProgress() {
  const ch = chapterQuizData[currentChapter];
  let answered = 0;
  ch.questions.forEach((q, idx) => {
    if (userAnswers[idx] !== undefined && userAnswers[idx] !== '' &&
        (!Array.isArray(userAnswers[idx]) || userAnswers[idx].length > 0)) {
      answered++;
    }
  });
  const total = ch.questions.length;
  const pct = Math.round(answered / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = '已完成 ' + answered + ' / ' + total + ' 题';

  // 更新mini进度
  const passed = getPassStatus(currentChapter);
  document.getElementById('progressMini').textContent =
    '本章' + (passed ? '已通关' : '未通关') + ' · 作答进度 ' + answered + '/' + total;
}

// ===== 提交评分 =====
function submitQuiz() {
  const ch = chapterQuizData[currentChapter];

  // 检查是否全部作答
  const unanswered = [];
  ch.questions.forEach((q, idx) => {
    if (userAnswers[idx] === undefined || userAnswers[idx] === '' ||
        (Array.isArray(userAnswers[idx]) && userAnswers[idx].length === 0)) {
      unanswered.push(idx + 1);
    }
  });
  if (unanswered.length > 0) {
    alert('⚠️ 你还有第 ' + unanswered.join('、') + ' 题未作答，请完成后再提交！');
    return;
  }

  quizSubmitted = true;
  localStorage.setItem('erjian_submitted_' + currentChapter, 'true');
  localStorage.setItem('erjian_answers_' + currentChapter, JSON.stringify(userAnswers));

  // 计算分数
  const scoreInfo = calculateScore(ch);

  // 判断是否通关
  const passed = scoreInfo.totalScore >= ch.passingScore;
  setPassStatus(currentChapter, passed);

  // 显示答案
  showAnswers(false, scoreInfo);
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'block';

  // 通关后显示下一章按钮
  if (passed) {
    const currentIdx = chapterOrder.indexOf(currentChapter);
    if (currentIdx < chapterOrder.length - 1) {
      document.getElementById('nextChapterBtn').style.display = 'block';
    }
    // 更新章节信息卡
    renderChapterInfo(ch);
    // 重新渲染导航
    renderChapterNav();
  } else {
    showLockBanner();
  }

  document.getElementById('answerSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ===== 计算分数 =====
function calculateScore(ch) {
  let score = 0;
  let maxScore = 0;
  const results = [];

  ch.questions.forEach((q, idx) => {
    if (q.type === 'single') {
      maxScore += 1;
      if (userAnswers[idx] === q.answer) {
        score += 1;
        results.push({ idx, correct: true, partial: false });
      } else {
        results.push({ idx, correct: false, partial: false });
      }
    } else if (q.type === 'multi') {
      maxScore += 2;
      const correctSet = new Set(q.answer);
      const userSet = new Set(userAnswers[idx] || []);
      const hasWrong = [...userSet].some(x => !correctSet.has(x));
      const hasAll = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
      const hasSome = [...correctSet].some(x => userSet.has(x));

      if (hasAll) {
        score += 2;
        results.push({ idx, correct: true, partial: false });
      } else if (!hasWrong && hasSome) {
        score += 1;
        results.push({ idx, correct: false, partial: true });
      } else {
        results.push({ idx, correct: false, partial: false });
      }
    }
  });

  const totalScore = Math.round((score / maxScore) * 100);
  return { score, maxScore, totalScore, results };
}

// ===== 显示答案 =====
function showAnswers(fromLoad, scoreInfo) {
  const ch = chapterQuizData[currentChapter];

  if (!scoreInfo) {
    scoreInfo = calculateScore(ch);
  }

  // 标记选项
  ch.questions.forEach((q, idx) => {
    const container = document.getElementById('options-' + idx);
    if (!container) return;
    const options = container.querySelectorAll('.option');
    options.forEach((el, i) => {
      el.classList.remove('selected', 'correct', 'wrong');
      el.style.pointerEvents = 'none';
      if (q.type === 'multi') {
        const correctSet = Array.isArray(q.answer) ? q.answer : [q.answer];
        const userSet = userSetOrDefault(userAnswers[idx]);
        const isCorrect = correctSet.includes(i);
        const isSelected = userSet.includes(i);
        if (isCorrect) el.classList.add('correct');
        if (isSelected && !isCorrect) el.classList.add('wrong');
      } else {
        if (i === q.answer) el.classList.add('correct');
        else if (userAnswers[idx] === i && i !== q.answer) el.classList.add('wrong');
      }
    });
  });

  // 渲染答案区域
  let html = '';

  // 分数卡片
  html += '<div class="score-card fade-in">';
  let emoji = '😞';
  let level = '需努力';
  if (scoreInfo.totalScore >= 90) { emoji = '🏆'; level = '优秀'; }
  else if (scoreInfo.totalScore >= 80) { emoji = '👍'; level = '良好'; }
  else if (scoreInfo.totalScore >= 60) { emoji = '💪'; level = '及格'; }
  else { emoji = '📚'; level = '不及格'; }

  html += '<div class="score-emoji">' + emoji + '</div>';
  html += '<div class="score-num">' + scoreInfo.totalScore + '<span class="score-total"> / 100</span></div>';
  html += '<div class="score-label">评级：' + level + '</div>';

  const passed = scoreInfo.totalScore >= ch.passingScore;
  html += '<div class="pass-status ' + (passed ? 'passed' : 'failed') + '">';
  html += passed ? '✅ 本章通关！可进入下一章节' : '❌ 未达通关线（≥' + ch.passingScore + '分），请继续学习本章';
  html += '</div></div>';

  // 各题答案
  ch.questions.forEach((q, idx) => {
    const r = scoreInfo.results[idx];
    html += '<div class="answer-item fade-in">';
    html += '<div class="a-title">';
    html += '<span>第 ' + (idx + 1) + ' 题 · ' + q.typeLabel + '</span>';
    if (r.correct) {
      html += '<span class="tag tag-correct">✓ 正确</span>';
    } else if (r.partial) {
      html += '<span class="tag" style="background:#fef7e0;color:#b06000;">△ 部分正确</span>';
    } else {
      html += '<span class="tag tag-wrong">✗ 错误</span>';
    }
    html += '</div>';
    html += '<div class="a-content">';
    html += '<div class="label">正确答案：' + formatAnswer(q) + '</div>';
    html += '<div class="explanation">' + q.explanation + '</div>';
    html += '<div class="kp-tag">📍 考点：' + q.knowledgePoint + '</div>';
    html += '</div></div>';
  });

  // 整体评价
  html += generateOverallEval(scoreInfo, ch);

  const section = document.getElementById('answerSection');
  section.innerHTML = html;
  section.classList.add('show');
}

function userSetOrDefault(val) {
  if (Array.isArray(val)) return val;
  if (val === undefined || val === '') return [];
  return [val];
}

function formatAnswer(q) {
  if (q.type === 'multi') {
    return q.answer.map(a => String.fromCharCode(65 + a)).join('、');
  }
  return String.fromCharCode(65 + q.answer);
}

// ===== 整体评价 =====
function generateOverallEval(scoreInfo, ch) {
  const singleCorrect = scoreInfo.results.filter((r, i) => {
    return ch.questions[i].type === 'single' && r.correct;
  }).length;
  const singleTotal = ch.questions.filter(q => q.type === 'single').length;
  const multiFullCorrect = scoreInfo.results.filter((r, i) => {
    return ch.questions[i].type === 'multi' && r.correct;
  }).length;
  const multiPartial = scoreInfo.results.filter((r, i) => {
    return ch.questions[i].type === 'multi' && r.partial;
  }).length;
  const multiTotal = ch.questions.filter(q => q.type === 'multi').length;

  let level, comment, tips;
  const passed = scoreInfo.totalScore >= ch.passingScore;

  if (passed && scoreInfo.totalScore >= 90) {
    level = '🏆 优秀 · 本章掌握扎实';
    comment = '你对「' + ch.chapterName + '」的核心考点掌握得非常扎实！单选题基本不失分，多选题也能准确判断正确选项，说明对知识点的理解深入、辨析能力强。';
    tips = '💡 <strong>复习建议：</strong>① 继续保持当前学习节奏；② 可将本章易混淆知识点（如风管适用范围、电缆型号后缀含义）做成记忆卡片，考前快速回顾；③ 进入下一章节学习。';
  } else if (passed) {
    level = '👍 良好 · 已满足通关要求';
    comment = '你已通过本章考核，基本掌握了核心知识点。但多选题存在部分选对或漏选的情况，说明对某些易混淆考点的辨析还不够精准。';
    tips = '💡 <strong>复习建议：</strong>① 重点复习多选题中出错的题目，尤其是非金属风管适用范围、电线电缆型号辨析、铜合金分类等高频易混考点；② 建议重新作答本章错题后再进入下一章节；③ 记忆口诀要反复背诵。';
  } else {
    level = '📚 未通关 · 需继续学习本章';
    comment = '本章得分未达到通关线（≥' + ch.passingScore + '分）。从错题来看，你可能对以下知识点掌握不够：非金属风管的适用/不适用范围、低合金结构钢牌号与应用对应关系、电线电缆型号字母含义、有色金属分类等。';
    tips = '💡 <strong>复习建议：</strong>① 先回到教材通读「1.1 机电工程常用材料」全部内容，重点看教材中的"例如""如"等举例；② 逐题对照答案解析，理解每个选项的对错原因；③ 背诵记忆口诀；④ 重新作答本章题目，直到得分≥80分再进入下一章节。<strong>切记：第一轮复习要求全面掌握，不要跳章！</strong>';
  }

  return `
    <div class="overall-eval fade-in">
      <h3>${level}</h3>
      <p>${comment}</p>
      <div class="tip">${tips}</div>
      <div class="tip" style="border-top:1px dashed #f9ab00; margin-top:10px; padding-top:10px;">
        📊 <strong>答题统计：</strong><br>
        单选题 ${singleCorrect}/${singleTotal} 题正确<br>
        多选题 全对 ${multiFullCorrect}/${multiTotal} 题，部分正确 ${multiPartial}/${multiTotal} 题<br>
        总分：${scoreInfo.totalScore}/100（通关线 ${ch.passingScore} 分）
      </div>
    </div>`;
}

// ===== 重新作答 =====
function resetQuiz() {
  if (!confirm('确定要重新作答吗？当前答案将被清除。')) return;
  userAnswers = {};
  quizSubmitted = false;
  localStorage.removeItem('erjian_answers_' + currentChapter);
  localStorage.removeItem('erjian_submitted_' + currentChapter);
  document.getElementById('answerSection').classList.remove('show');
  document.getElementById('submitBtn').style.display = 'block';
  document.getElementById('resetBtn').style.display = 'none';
  document.getElementById('nextChapterBtn').style.display = 'none';
  renderQuiz();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== 进入下一章 =====
function goNextChapter() {
  const currentIdx = chapterOrder.indexOf(currentChapter);
  if (currentIdx < chapterOrder.length - 1) {
    const nextId = chapterOrder[currentIdx + 1];
    switchChapter(nextId);
  } else {
    alert('🎉 恭喜！你已完成所有已发布章节的学习。新章节将持续更新，请关注网站更新。');
  }
}

function showShortcutModal() {
  document.getElementById('shortcutModal').classList.add('show');
}
function closeShortcutModal() {
  document.getElementById('shortcutModal').classList.remove('show');
}
