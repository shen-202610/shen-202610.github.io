<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a5fb4">
<title>二建机电 · 分章节刷题</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--blue:#1a5fb4;--blue2:#4a90d9;--bg:#f4f6fa;--card:#fff;--ok:#2e8b57;--warn:#c0392b;--line:#e5e9f0;--txt:#1c2430;--sub:#66727f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.65}
.wrap{max-width:720px;margin:0 auto;padding:0 0 90px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:14px 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h-top h1{font-size:18px;margin:0;font-weight:700}
.badge{font-size:12px;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:20px;white-space:nowrap}
.progress-outer{margin-top:10px;height:6px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
.progress-inner{height:100%;width:0;background:#ffd666;transition:width .3s}
.p-label{font-size:12px;margin-top:5px;opacity:.92}
.tabs{display:flex;gap:8px;padding:12px 14px;background:var(--card);position:sticky;top:66px;z-index:15;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{flex:1;min-width:88px;text-align:center;font-size:14px;padding:8px 4px;border-radius:10px;background:var(--bg);color:var(--sub);cursor:pointer;transition:.2s;border:1px solid transparent;user-select:none}
.tab.active{background:var(--blue);color:#fff;font-weight:600}
.tab.err{background:#fdecea;color:var(--warn);border-color:#f5c6cb}
.card{background:var(--card);margin:14px;border-radius:16px;padding:18px 16px;box-shadow:0 2px 12px rgba(20,40,80,.06)}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;background:#eaf2fd;color:var(--blue);font-weight:600}
.tag.multi{background:#fef3e2;color:#d97706}
.tag.kp{background:#f0f4f8;color:var(--sub);font-weight:400}
.tag.diff{background:#eefaf3;color:var(--ok)}
.tag.done{background:#e9ecef;color:#495057}
.qtext{font-size:17px;font-weight:600;line-height:1.7;margin:6px 0 16px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.15s;display:flex;gap:10px;align-items:flex-start;user-select:none}
.opt .no{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.opt.sel{border-color:var(--blue);background:#f0f6ff}
.opt.sel .no{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--ok);background:#eefaf3}
.opt.ok .no{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--warn);background:#fdecea}
.opt.bad .no{background:var(--warn);color:#fff}
.opt.disabled{pointer-events:none;opacity:.9}
.opt-txt{font-size:15.5px;line-height:1.55}
.exp{margin-top:14px;padding:14px;border-radius:12px;background:#f7f9fc;border-left:4px solid var(--blue);font-size:14.5px;line-height:1.75;display:none}
.exp.show{display:block}
.exp strong{color:var(--blue)}
.btn{display:inline-block;border:none;border-radius:12px;padding:13px 22px;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:var(--blue);color:#fff;width:100%}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:#b8c6d8;cursor:not-allowed}
.btn-ghost{background:var(--bg);color:var(--blue);border:1px solid var(--blue)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 14px 0}
.pager .btn{flex:1}
.pager .btn:disabled{opacity:.4}
.cnt{text-align:center;font-size:13px;color:var(--sub);margin:14px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 16px;justify-content:center}
.chip{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--bg);color:var(--sub);cursor:pointer;border:1.5px solid transparent}
.chip.cur{border-color:var(--blue);background:#eaf2fd}
.chip.right{background:#eefaf3;color:var(--ok)}
.chip.wrong{background:#fdecea;color:var(--warn)}
.chip.done{background:#eaf2fd;color:var(--blue)}
/* 首页 / 章节选择 */
.chapter{background:var(--card);margin:12px 14px;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(20,40,80,.05);cursor:pointer;transition:.15s;border:1.5px solid transparent}
.chapter:active{transform:scale(.99)}
.chapter.locked{opacity:.55;cursor:not-allowed}
.chapter-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chapter-title{font-weight:700;font-size:16px}
.chapter-title small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:3px}
.ch-state{font-size:12px;white-space:nowrap;padding:3px 9px;border-radius:20px}
.st-new{background:#eaf2fd;color:var(--blue)}
.st-doing{background:#fef3e2;color:#d97706}
.st-pass{background:#eefaf3;color:var(--ok)}
.st-lock{background:#eceff3;color:#95a0ac}
.mini-bar{margin-top:10px;height:5px;background:var(--bg);border-radius:4px;overflow:hidden}
.mini-bar>i{display:block;height:100%;background:var(--ok);border-radius:4px}
/* 成绩弹层 */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.result{background:#fff;border-radius:20px;width:100%;max-width:420px;padding:24px 20px;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.result h2{margin:0 0 6px;text-align:center;font-size:22px}
.bigscore{text-align:center;font-size:46px;font-weight:800;color:var(--blue);line-height:1.1;margin:8px 0}
.bigscore.pass{color:var(--ok)}
.bigscore.fail{color:var(--warn)}
.res-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.res-row b{color:var(--blue)}
.eval{background:#f7f9fc;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:14px;line-height:1.7}
.eval strong{color:var(--blue)}
.res-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
/* 错题本 */
.empty{text-align:center;color:var(--sub);padding:40px 16px;font-size:15px}
.empty .ico{font-size:42px;margin-bottom:10px}
.wb-item{background:var(--card);margin:12px 14px;border-radius:14px;padding:14px;border-left:5px solid var(--warn);box-shadow:0 1px 6px rgba(20,40,80,.05)}
.wb-item .from{font-size:12px;color:var(--sub);margin-bottom:6px}
.wb-item .qt{font-weight:600;font-size:15.5px;margin-bottom:8px}
.wb-item .ans{font-size:14px;color:var(--ok);margin-bottom:4px}
.wb-item .ex{font-size:13.5px;color:var(--sub);line-height:1.65}
.wb-item .doit{margin-top:10px;font-size:14px;padding:8px 16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,30,45,.92);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px 16px 40px;line-height:1.7}
.guide-note{background:#fff8e6;border:1px solid #ffe08a;color:#8a6d1a;font-size:13px;margin:12px 14px;padding:11px 14px;border-radius:12px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <h1>二建机电 · 分章节刷题</h1>
    <span class="badge" id="badge">第一篇</span>
  </div>
  <div class="progress-outer"><div class="progress-inner" id="progIn"></div></div>
  <div class="p-label" id="pLabel">第一篇 · 机电工程技术 —— 按小节逐一掌握</div>
</header>

<div class="tabs">
  <div class="tab active" data-view="home">📚 章节</div>
  <div class="tab" data-view="quiz">✍️ 练习</div>
  <div class="tab err" data-view="wrong">📌 错题本</div>
</div>

<div class="wrap">

  <!-- 首页：章节列表 -->
  <div id="v-home"></div>

  <!-- 练习区 -->
  <div id="v-quiz" style="display:none">
    <div class="card">
      <div class="qmeta" id="qmeta"></div>
      <div class="qtext" id="qtext"></div>
      <div id="optbox"></div>
      <div class="exp" id="exp"></div>
      <button class="btn btn-primary" id="confirmBtn" disabled>确认提交</button>
    </div>
    <div class="cnt" id="cnt"></div>
    <div class="chips" id="chips"></div>
    <div class="pager">
      <button class="btn btn-ghost" id="prevBtn">← 上一题</button>
      <button class="btn btn-primary" id="nextBtn">下一题 →</button>
    </div>
    <div class="guide-note" id="guideNote"></div>
  </div>

  <!-- 错题本 -->
  <div id="v-wrong"></div>

</div>

<footer>数据按2024版教材知识点编写 · 题目与解析仅用于学习<br>本页自动保存在手机本地，重开可继续</footer>

<div class="overlay" id="overlay">
  <div class="result" id="resultBox"></div>
</div>

<div class="toast" id="toast"></div>

<script src="quiz-data.js"></script>
<script>
/* ================= 工具 ================= */
const LS_KEY='erjian_v2';
const store=Object.assign({progress:{},wrongs:{},lastView:'home'},(function(){
  try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch(e){return{}}
})());
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store))}catch(e){}}
/* 章节归位迁移：1.3/1.4/1.5 → 2.1/2.2/2.3（按2024版考试用书第二章归位） */
const SEC_MIGRATE={'1.3':'2.1','1.4':'2.2','1.5':'2.3'};
function migrateStore(){
  let changed=false;
  const pr=store.progress||{};
  Object.keys(SEC_MIGRATE).forEach(k=>{
    const nk=SEC_MIGRATE[k];
    if(pr[k]===undefined)return;
    const oldA=pr[k].answers||{};
    const remap={};
    Object.keys(oldA).forEach(qid=>{
      const nqid=qid.replace(new RegExp('^'+k.replace('.','\\.')+'-'),nk+'-');
      remap[nqid]=oldA[qid];
    });
    if(pr[nk]===undefined){pr[nk]=pr[k];pr[nk].answers=remap;}
    else{
      const newA=pr[nk].answers||{};
      Object.keys(remap).forEach(qid=>{if(newA[qid]===undefined)newA[qid]=remap[qid];});
      pr[nk].answers=newA;
      pr[nk].done=pr[nk].done||pr[k].done;
      if(pr[nk].score===undefined)pr[nk].score=pr[k].score;
      if(!pr[nk].time)pr[nk].time=pr[k].time;
    }
    delete pr[k];changed=true;
  });
  const wb=store.wrongs||{};
  Object.keys(wb).forEach(id=>{
    const m=id.match(/^1\.[345]-(.*)$/);
    if(!m)return;
    const nid=SEC_MIGRATE[id.slice(0,3)]+'-'+m[1];
    if(wb[nid]===undefined){
      try{const w=JSON.parse(wb[id]);w.id=nid;wb[nid]=JSON.stringify(w);}catch(e){wb[nid]=wb[id];}
    }
    delete wb[id];changed=true;
  });
  if(changed)save();
}
migrateStore();
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= 状态 ================= */
let view='home';
let curSec=null,curIdx=0,mode='section'; // mode: section | wrong
let answers={};     // {qid: [idx,...]}
let answered={};    // {qid: true} 只标记已作答，不暴露对错
let wrongList=[];   // 当前错题重练队列
let multiTimer=null; // 多选自动翻页计时器

const allSections=sectionOrder.map(k=>({key:k,data:sectionQuizData[k]}));

/* ================= 章节首页 ================= */
function sectionPassed(key){
  const p=store.progress[key];
  if(!p||!p.done) return false;
  const q=sectionQuizData[key].questions;
  const right=q.filter(x=>p.answers&&p.answers[x.id]&&sameAnswer(x,p.answers[x.id])).length;
  return Math.round(right/q.length*100)>=sectionQuizData[key].passingScore;
}
function sameAnswer(q,a){ // a: [idx]
  const ca=Array.isArray(q.answer)?q.answer:[q.answer];
  return ca.length===a.length && ca.every(x=>a.includes(x));
}
function isLocked(key){
  const list=sectionOrder;const i=list.indexOf(key);
  if(i<=0) return false;
  return !sectionPassed(list[i-1]);
}
function renderHome(){
  const box=document.getElementById('v-home');
  let html='';
  Object.keys(chapterMeta).forEach(ch=>{
    html+='<div style="margin:18px 16px 4px;font-size:14px;color:var(--sub);font-weight:600">'+esc(ch)+'</div>';
    chapterMeta[ch].forEach(key=>{
      const d=sectionQuizData[key];
      if(!d){return;}
      const lock=isLocked(key);
      const p=store.progress[key];
      let state,bar='';
      if(lock){state='<span class="ch-state st-lock">🔒 需先通过上一节</span>';}
      else if(sectionPassed(key)){state='<span class="ch-state st-pass">✅ 已通过 '+p.score+'分</span>';bar='<div class="mini-bar"><i style="width:100%"></i></div>';}
      else if(p&&p.done){state='<span class="ch-state st-doing">↻ 未达标 '+p.score+'分 · 可重做</span>';bar='<div class="mini-bar"><i style="width:'+p.score+'%"></i></div>';}
      else if(p&&p.answers){const n=Object.keys(p.answers).length;state='<span class="ch-state st-doing">✎ 做了 '+n+'/'+d.questions.length+' 题</span>';bar='<div class="mini-bar"><i style="width:'+Math.round(n/d.questions.length*100)+'%"></i></div>';}
      else{state='<span class="ch-state st-new">🆕 未开始</span>';}
      html+='<div class="chapter'+(lock?' locked':'')+'" data-sec="'+key+'">'+
        '<div class="chapter-head"><div class="chapter-title">'+key+' '+esc(d.sectionName)+'<small>'+d.questions.length+'题 · 单选+多选 · 及格线'+d.passingScore+'分</small></div>'+state+'</div>'+bar+'</div>';
    });
  });
  box.innerHTML=html;
  box.querySelectorAll('.chapter').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.sec;
      if(isLocked(k)){toast('请先通过上一节：'+sectionOrder[sectionOrder.indexOf(k)-1]);return;}
      startSection(k);
    };
  });
}

/* ================= 开始一节 ================= */
function startSection(key){
  if(!sectionQuizData[key]){toast('该小节数据暂未开放');renderHome();showView('home');return;}
  curSec=key;mode='section';curIdx=0;answers={};answered={};
  const p=store.progress[key];
  if(p&&p.answers){
    Object.keys(p.answers).forEach(qid=>{answers[qid]=p.answers[qid];answered[qid]=true;});
  }
  showView('quiz');
}
function startWrong(list){
  wrongList=list.map(x=>({id:x.id,type:x.type,question:x.question,options:x.options,answer:x.answer,explanation:x.explanation,knowledgePoint:x.knowledgePoint,typeLabel:x.typeLabel}));
  if(!wrongList.length){toast('没有错题可练');return;}
  mode='wrong';curSec=null;curIdx=0;answers={};answered={};
  showView('quiz');
}

/* ================= 渲染题目 ================= */
function curList(){const d=mode==='section'?sectionQuizData[curSec]:null;return (mode==='section'&&d)?d.questions:wrongList;}
function curQ(){const l=curList();return l[Math.min(curIdx,l.length-1)];}
function renderQuiz(){
  const q=curQ();if(!q)return;
  const list=curList();
  // 顶部元信息
  const d=mode==='section'?sectionQuizData[curSec]:{sectionName:'错题重练'};
  document.getElementById('qmeta').innerHTML=
    '<span class="tag'+(q.type==='multiple'?' multi':'')+'">'+q.typeLabel+'</span>'+
    '<span class="tag kp">'+esc(q.knowledgePoint||'')+'</span>'+
    '<span class="tag diff">'+esc(q.difficulty||'')+'</span>'+
    (answered[q.id]?'<span class="tag done">已作答</span>':'');
  document.getElementById('qtext').textContent=q.question;
  // 选项
  const my=answers[q.id]||[];
  const box=document.getElementById('optbox');
  box.innerHTML=q.options.map((o,i)=>{
    let cls='opt';let no=String.fromCharCode(65+i);
    if(my.includes(i)){cls+=' sel';}
    return '<div class="'+cls+'" data-i="'+i+'"><div class="no">'+no+'</div><div class="opt-txt">'+esc(o)+'</div></div>';
  }).join('');
  box.querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>toggleOpt(q,el.dataset.i|0);
  });
  // 解析
  const exp=document.getElementById('exp');
  exp.classList.remove('show');exp.innerHTML='';
  // 按钮（已改为选完自动翻页，确认按钮不再显示）
  const cBtn=document.getElementById('confirmBtn');
  cBtn.style.display='none';
  // 进度
  document.getElementById('cnt').textContent=(mode==='section'?'本节 ':'错题 ')+'第 '+(curIdx+1)+' / '+list.length+' 题';
  document.getElementById('pLabel').textContent=(mode==='section'?(curSec+' '+d.sectionName):'错题重练 · 来自已掌握章节的错题');
  document.getElementById('badge').textContent=(mode==='section'?(curSec[0]==='2'?'第二章':'第一章'):'错题本');
  document.getElementById('progIn').style.width=((curIdx+1)/list.length*100)+'%';
  // 翻页按钮
  document.getElementById('prevBtn').disabled=curIdx===0;
  document.getElementById('nextBtn').textContent=(curIdx===list.length-1)?(mode==='section'?'完成本节 →':'完成重练 →'):'下一题 →';
  document.getElementById('nextBtn').disabled=false;
  // 题号 chips
  const chips=document.getElementById('chips');chips.innerHTML='';
  list.forEach((x,i)=>{
    let c='chip';if(i===curIdx)c+=' cur';else if(answered[x.id])c+=' done';
    chips.innerHTML+='<div class="'+c+'" data-i="'+i+'">'+(i+1)+'</div>';
  });
  chips.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{curIdx=el.dataset.i|0;renderQuiz();});
  // 提示
  const g=document.getElementById('guideNote');
  if(mode==='section'){
    const pass=sectionPassed(curSec);
    g.innerHTML=pass?'<b>本节已通过</b>，可继续下一节。':'全部答完后统一查看答案与解析；单选点选即自动下一题，多选勾满 2 项自动下一题。<b>本节达到 '+sectionQuizData[curSec].passingScore+' 分及以上</b>，下一节才会解锁。';
  }else{g.innerHTML='错题重练：全部答完后统一统计，答对的错题自动移出，答错的继续保留在错题本。';}
}
function toggleOpt(q,i){
  const id=q.id;
  answers[id]=answers[id]||[];
  if(q.type==='single'){
    // 单选：点选即记录并自动翻页（350ms 内仍可改选）
    answers[id]=[i];answered[id]=true;saveAnswer(q,answers[id]);renderQuiz();
    clearTimeout(multiTimer);
    setTimeout(()=>{if(curQ()===q){advanceNow();}},350);
  }else{
    const p=answers[id];const j=p.indexOf(i);
    if(j>=0)p.splice(j,1);else p.push(i);
    renderQuiz();
    // 多选：勾满 2 项后停止点击 900ms 自动翻页（可继续加选）
    if(p.length>=2){
      clearTimeout(multiTimer);
      multiTimer=setTimeout(()=>{if(curQ()===q&&answers[id]&&answers[id].length>=2){advanceNow();}},900);
    }
  }
}
function advanceNow(){
  const q=curQ();const my=answers[q.id]||[];
  if(!my.length){return;}
  answered[q.id]=true;
  saveAnswer(q,my);
  const list=curList();
  if(curIdx<list.length-1){
    const nxt=curIdx+1;
    setTimeout(()=>{if(curIdx===nxt-1){curIdx=nxt;renderQuiz();window.scrollTo(0,0);}},280);
  }else{
    setTimeout(()=>{if(curIdx===list.length-1)finishSection();},380);
  }
}
function saveAnswer(q,my){
  if(mode==='section'){
    const p=store.progress[curSec]||{answers:{}};
    p.answers[q.id]=my;store.progress[curSec]=p;save();
  }
}
function finishSection(){
  if(mode==='wrong'){finishWrong();return;}
  const q=sectionQuizData[curSec].questions;
  const p=store.progress[curSec]||{answers:{}};
  // 汇总本次作答
  Object.keys(answers).forEach(k=>p.answers[k]=answers[k]);
  const right=q.filter(x=>p.answers[x.id]&&sameAnswer(x,p.answers[x.id])).length;
  const total=q.length;const score=Math.round(right/total*100);
  p.done=true;p.score=score;p.time=new Date().toISOString().slice(0,10);
  store.progress[curSec]=p;
  // 重算错题本：只保留各节仍然答错的
  rebuildWrongs();
  save();
  showResult(score,right,total,q);
}
function rebuildWrongs(){
  const all={};
  sectionOrder.forEach(k=>{
    const d=sectionQuizData[k];if(!d)return;
    const p=store.progress[k];if(!p||!p.answers)return;
    d.questions.forEach(x=>{
      if(p.answers[x.id]===undefined) return;
      if(!sameAnswer(x,p.answers[x.id]||[])){
        all[x.id]=JSON.stringify({id:x.id,type:x.type,typeLabel:x.typeLabel,question:x.question,options:x.options,answer:x.answer,explanation:x.explanation,knowledgePoint:x.knowledgePoint});
      }
    });
  });
  // 保留已答对的待重练标记对应的错题清除
  store.wrongs=all;
}
function finishWrong(){
  // 重练后：答对的错题真正移除，答错的保留
  const stillWrong=[];
  wrongList.forEach(x=>{
    const my=answers[x.id];
    if(sameAnswer(x,my||[])){
      delete store.wrongs[x.id];
    }else{
      store.wrongs[x.id]=JSON.stringify(x);stillWrong.push(x);
    }
  });
  save();
  const total=wrongList.length,ok=total-stillWrong.length;
  const rbox=document.getElementById('resultBox');
  rbox.innerHTML='<h2>🔄 错题重练完成</h2>'+
    '<div class="bigscore '+(ok===total?'pass':(ok/total>=0.6?'':'fail'))+'">'+(total?Math.round(ok/total*100):100)+'分</div>'+
    '<div class="res-row"><span>重练题数</span><b>'+total+'</b></div>'+
    '<div class="res-row"><span>本次做对</span><b style="color:var(--ok)">'+ok+'</b></div>'+
    '<div class="res-row"><span>仍需巩固</span><b style="color:var(--warn)">'+stillWrong.length+'</b></div>'+
    '<div class="eval"><strong>提示：</strong>'+(stillWrong.length?'这 '+stillWrong.length+' 题仍在错题本中，建议隔天再做一遍，直到全部做对。':'太棒了！本次错题已全部做对，已从错题本移除 🎉' )+'</div>'+
    '<div class="res-btns">'+
    (stillWrong.length?'<button class="btn btn-primary" id="wbAgain">再练一遍这些错题</button>':'')+
    '<button class="btn btn-ghost" id="wbBack">返回错题本</button></div>';
  document.getElementById('overlay').classList.add('show');
  const again=document.getElementById('wbAgain');if(again)again.onclick=()=>{document.getElementById('overlay').classList.remove('show');startWrong(stillWrong);};
  document.getElementById('wbBack').onclick=()=>{document.getElementById('overlay').classList.remove('show');renderWrong();showView('wrong');};
}
function showResult(score,right,total,q){
  const pass=score>=sectionQuizData[curSec].passingScore;
  const wrongN=total-right;
  let evalTxt='';
  if(pass){evalTxt='本节知识点掌握扎实。建议<b>隔天回做一遍错题</b>巩固记忆，再进入下一节。';}
  else{evalTxt='未达标。<b>请先认真看下方每题解析</b>，特别是错题对应的「考点归纳」与「记忆口诀」，再点下方「重做本节」；本章内容未掌握前，不进入下一节。';}
  const p=store.progress[curSec]||{answers:{}};
  // 逐题解析
  let rvHtml='';
  q.forEach((x,i)=>{
    const my=p.answers[x.id]||[];
    const ca=Array.isArray(x.answer)?x.answer:[x.answer];
    const ok=my.length&&sameAnswer(x,my);
    rvHtml+='<div style="border-bottom:1px solid #eee;padding:10px 0;text-align:left">'+
      '<div style="font-weight:600;font-size:15px">'+(i+1)+'. '+esc(x.question)+' <span class="tag">'+x.typeLabel+'</span></div>'+
      '<div style="font-size:13px;margin:5px 0">你的答案：<b style="color:'+(ok?'var(--ok)':'var(--warn)')+'">'+(my.length?my.map(a=>String.fromCharCode(65+a)).join('、'):'未答')+'</b> ｜ 正确答案：<b style="color:var(--ok)">'+ca.map(a=>String.fromCharCode(65+a)).join('、')+'</b> '+(ok?'✅':'❌')+'</div>'+
      '<div style="font-size:13px;line-height:1.65;background:#f7f9fc;padding:9px;border-radius:8px">'+x.explanation+'</div></div>';
  });
  const rbox=document.getElementById('resultBox');
  rbox.innerHTML='<h2>'+(pass?'🎉 本节通过':'📖 还需巩固')+'</h2>'+
    '<div class="bigscore '+(pass?'pass':'fail')+'">'+score+'<span style="font-size:22px">分</span></div>'+
    '<div class="res-row"><span>小节</span><b>'+curSec+' '+esc(sectionQuizData[curSec].sectionName)+'</b></div>'+
    '<div class="res-row"><span>答对 / 总题</span><b>'+right+' / '+total+'</b></div>'+
    '<div class="res-row"><span>答错</span><b style="color:var(--warn)">'+wrongN+'</b></div>'+
    '<div class="res-row"><span>及格线</span><b>'+sectionQuizData[curSec].passingScore+'分</b></div>'+
    '<div class="eval"><strong>整体评价：</strong>'+evalTxt+'</div>'+
    '<div style="font-size:14px;font-weight:700;color:var(--blue);margin:12px 0 4px">📖 逐题解析（答错已自动收录到错题本）</div>'+
    '<div style="max-height:46vh;overflow:auto;margin:6px 0 14px">'+rvHtml+'</div>'+
    '<div class="res-btns">'+
    '<button class="btn btn-primary" id="rRetry">🔄 重做本节</button>'+
    (pass&&sectionOrder.indexOf(curSec)+1<sectionOrder.length?'<button class="btn btn-primary" id="rNext">进入下一节：'+sectionOrder[sectionOrder.indexOf(curSec)+1]+'</button>':'')+
    (wrongN>0?'<button class="btn btn-ghost" id="rWrong">只练本节错题</button>':'')+
    '<button class="btn btn-ghost" id="rHome">返回章节列表</button></div>';
  document.getElementById('overlay').classList.add('show');
  const retry=document.getElementById('rRetry');if(retry)retry.onclick=()=>{document.getElementById('overlay').classList.remove('show');startSection(curSec);};
  const nx=document.getElementById('rNext');if(nx)nx.onclick=()=>{document.getElementById('overlay').classList.remove('show');startSection(sectionOrder[sectionOrder.indexOf(curSec)+1]);};
  const rw=document.getElementById('rWrong');if(rw)rw.onclick=()=>{document.getElementById('overlay').classList.remove('show');const list=q.filter(x=>!sameAnswer(x,(store.progress[curSec].answers||{})[x.id]||[]));startWrong(list);};
  document.getElementById('rHome').onclick=()=>{document.getElementById('overlay').classList.remove('show');renderHome();showView('home');};
}

/* ================= 错题本 ================= */
let wbList=[],wbIdx=0; // 错题单题页状态
function openWb(list,idx){
  wbList=list.slice();wbIdx=idx;renderWb();document.getElementById('overlay').classList.add('show');
}
function renderWb(){
  const x=wbList[wbIdx];
  const ca=Array.isArray(x.answer)?x.answer:[x.answer];
  const ansTxt=ca.map(a=>String.fromCharCode(65+a)).join('、');
  const opts=x.options.map((o,i)=>{
    const ok=ca.includes(i);
    return '<div class="opt'+(ok?' ok':'')+'"><div class="no">'+String.fromCharCode(65+i)+'</div><div class="opt-txt">'+esc(o)+'</div></div>';
  }).join('');
  const rbox=document.getElementById('resultBox');
  rbox.innerHTML='<div style="text-align:left">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
      '<span class="tag">📌 错题 '+(wbIdx+1)+' / '+wbList.length+'</span>'+
      '<span class="tag'+(x.type==='multiple'?' multi':'')+'">'+esc(x.typeLabel)+'</span>'+
    '</div>'+
    '<div style="max-height:56vh;overflow:auto;padding-right:4px;-webkit-overflow-scrolling:touch">'+
      '<div class="qmeta" style="margin:2px 0 4px">'+
        '<span class="tag kp">'+esc(x.knowledgePoint||'')+'</span>'+
        '<span class="tag diff">'+esc(x.difficulty||'')+'</span>'+
      '</div>'+
      '<div style="font-size:16px;font-weight:600;line-height:1.7;margin:4px 0 12px">'+esc(x.question)+'</div>'+
      opts+
      '<div style="margin-top:12px;padding:11px 13px;border-radius:12px;background:#eefaf3;font-size:14px;color:var(--ok);font-weight:600">✅ 正确答案：'+ansTxt+'</div>'+
      '<div style="margin-top:10px;padding:13px;border-radius:12px;background:#f7f9fc;border-left:4px solid var(--blue);font-size:14px;line-height:1.75">'+x.explanation+'</div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
      '<button class="btn btn-ghost" id="wbPrev" style="flex:1">← 上一题</button>'+
      '<button class="btn btn-ghost" id="wbDel" style="flex:1.4">✅ 我会了</button>'+
      '<button class="btn btn-primary" id="wbNext" style="flex:1">下一题 →</button>'+
    '</div>'+
    '<div style="margin-top:10px"><button class="btn btn-ghost" id="wbClose" style="width:100%">返回错题本</button></div>'+
  '</div>';
  const pEl=document.getElementById('wbPrev');pEl.disabled=wbIdx===0;if(pEl.disabled)pEl.style.opacity=.4;else pEl.style.opacity=1;
  const nEl=document.getElementById('wbNext');nEl.disabled=wbIdx===wbList.length-1;if(nEl.disabled)nEl.style.opacity=.4;else nEl.style.opacity=1;
  pEl.onclick=()=>{wbIdx--;renderWb();};
  nEl.onclick=()=>{wbIdx++;renderWb();};
  document.getElementById('wbClose').onclick=()=>{document.getElementById('overlay').classList.remove('show');renderWrong();showView('wrong');};
  document.getElementById('wbDel').onclick=()=>{
    const id=x.id;delete store.wrongs[id];save();toast('已移出错题本');
    wbList.splice(wbIdx,1);
    if(!wbList.length){document.getElementById('overlay').classList.remove('show');renderWrong();showView('wrong');return;}
    if(wbIdx>=wbList.length)wbIdx=wbList.length-1;
    renderWb();
  };
  // 左右滑动切换题目
  let sx=null;
  rbox.ontouchstart=e=>{sx=e.touches[0].clientX;};
  rbox.ontouchend=e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx;
    if(dx<-45&&wbIdx<wbList.length-1){wbIdx++;renderWb();}
    else if(dx>45&&wbIdx>0){wbIdx--;renderWb();}
    sx=null;
  };
}
function renderWrong(){
  const box=document.getElementById('v-wrong');
  const list=Object.keys(store.wrongs).map(k=>JSON.parse(store.wrongs[k]));
  if(!list.length){
    box.innerHTML='<div class="empty"><div class="ico">🎯</div>错题本是空的<br>答错的题目会自动收集到这里<br>掌握了再移除，直到全部清零</div>';
    return;
  }
  let html='<div class="guide-note">共 <b>'+list.length+'</b> 道待巩固错题。点任意一题可单题翻看解析（上下滚动、左右切题）；点「我会了」移出错题本。</div>';
  list.forEach((x,i)=>{
    const ca=Array.isArray(x.answer)?x.answer:[x.answer];
    const ansTxt=ca.map(a=>String.fromCharCode(65+a)).join('、');
    html+='<div class="wb-item" data-idx="'+i+'"><div class="from">'+esc(x.typeLabel)+' · '+esc(x.knowledgePoint||'')+'</div>'+
      '<div class="qt">'+esc(x.question)+'</div>'+
      '<div class="ans">✅ 正确答案：'+ansTxt+'</div>'+
      '<button class="btn btn-ghost doit" data-id="'+x.id+'">我会了，移出错题本</button></div>';
  });
  html+='<div style="padding:0 14px"><button class="btn btn-primary" id="doAllWrong">📝 一次性重练全部错题</button></div>';
  box.innerHTML=html;
  box.querySelectorAll('.doit').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id;delete store.wrongs[id];save();toast('已移出错题本');renderWrong();});
  box.querySelectorAll('.wb-item').forEach(el=>el.onclick=()=>openWb(list,el.dataset.idx|0));
  document.getElementById('doAllWrong').onclick=()=>startWrong(list);
}

/* ================= 视图切换 ================= */
function showView(v){
  view=v;
  document.getElementById('v-home').style.display=v==='home'?'':'none';
  document.getElementById('v-quiz').style.display=v==='quiz'?'':'none';
  document.getElementById('v-wrong').style.display=v==='wrong'?'':'none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  store.lastView=v;save();
  if(v==='home')renderHome();
  if(v==='wrong')renderWrong();
  if(v==='quiz'&&!curQ()){toast('请先在章节页选择一节');showView('home');return;}
  if(v==='quiz')renderQuiz();
  window.scrollTo(0,0);
}

/* ================= 事件 ================= */
document.getElementById('prevBtn').onclick=()=>{if(curIdx>0){curIdx--;renderQuiz();window.scrollTo(0,0);}};
document.getElementById('nextBtn').onclick=()=>{
  const list=curList();
  // 允许直接翻页
  if(curIdx<list.length-1){curIdx++;renderQuiz();window.scrollTo(0,0);}
  else{finishSection();}
};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));

/* ================= 初始化 ================= */
renderHome();
showView(store.lastView==='quiz'&&curSec?'quiz':(store.lastView||'home'));
// 若上次在练习页但没有 curSec，回到 home
if(view==='quiz'&&!curQ())showView('home');

/* ================= PWA 离线缓存 ================= */
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
</script>
