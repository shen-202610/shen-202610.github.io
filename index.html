        options: ["纯铜具有良好的导电、导热性，且属于抗磁性物质", "黄铜是以镍为主要合金元素的铜合金", "白铜是以锌为主要合金元素的铜合金", "铝合金按成分和工艺分为铸造铝合金和变形铝合金，其中纯铝的强度高于纯铜"],

        explanation: "<strong>正确答案：A</strong><br><br><strong>【解析】</strong><br><strong>A正确：</strong>纯铜导电、导热性优良，且<strong>无铁磁性（抗磁性）</strong>，不受电磁干扰，可用于制造抗磁零件。<br><strong>B错误：</strong>黄铜是以<strong>锌</strong>为主要合金元素的铜合金。<br><strong>C错误：</strong>白铜是以<strong>镍</strong>为主要合金元素的铜合金。<br><strong>D错误：</strong>纯铝的强度<strong>低于</strong>纯铜。<br><br><strong>【考点归纳】</strong>黄铜=铜锌、白铜=铜镍、青铜=铜锡（除锌镍外）；纯铜抗磁。<br><strong>【记忆口诀】</strong>黄铜加锌白铜加镍，青铜加锡莫混记；纯铜抗磁能导电。" },
      { id: "1.1-008", type: "single", typeLabel: "单选题", knowledgePoint: "金属复合材料", difficulty: "中",
        question: "某建筑生活给水系统要求管材既卫生无毒，又能与金属管件可靠连接，宜选用的复合管材是（　）。",
        options: ["钢塑复合管", "铝塑复合管（PAP管）", "钛钢复合板", "铜钢复合板"],
        answer: 1,
        explanation: "<strong>正确答案：B</strong><br><br><strong>【解析】</strong><br><strong>B正确：</strong><strong>铝塑复合管（PAP管）</strong>内层为聚乙烯、外层为聚乙烯、中间为铝合金层，兼具塑料管的卫生性和金属管的强度，可弯曲、易连接，常用于建筑生活给水、采暖。<br><strong>A干扰：</strong>钢塑复合管强度高，但多用于工业及大口径管道。<br><br><strong>【考点归纳】</strong>金属复合管材：铝塑复合管（PAP）、钢塑复合管、涂塑钢管等，注意区分内外层材质和适用场合。<br><strong>【记忆口诀】</strong>铝塑复合中间铝，卫生耐压又能弯。" },
      { id: "1.1-009", type: "multiple", typeLabel: "多选题", knowledgePoint: "钢材的分类", difficulty: "中",
        question: "下列材料中，属于黑色金属的有（　）。",
        options: ["生铁", "铸铁", "钢", "铁合金", "铜合金"],
        answer: [0, 1, 2, 3],
        explanation: "<strong>正确答案：A、B、C、D</strong><br><br><strong>【解析】</strong><br><strong>A、B、C、D正确：</strong>黑色金属是以铁为主要成分的金属及其合金，包括<strong>生铁、铸铁、钢和铁合金</strong>。<br><strong>E错误：</strong>铜合金属<strong>有色金属</strong>。<br><br><strong>【考点归纳】</strong>黑色金属=铁基（生铁、铸铁、钢、铁合金）；其余金属（铜、铝、铅、钛、镍等）均为有色金属。<br><strong>【记忆口诀】</strong>铁家兄弟黑金属，生铁铸铁钢合金；铜铝铅钛算有色。" },
      { id: "1.1-010", type: "multiple", typeLabel: "多选题", knowledgePoint: "钢材分类（型钢板材管材线材）", difficulty: "中",
        question: "在机电工程中，钢制品通常包括（　）。",
        options: ["型钢", "板材", "管材", "线材", "钢制品"],
        answer: [0, 1, 2, 4],
        explanation: "<strong>正确答案：A、B、C、E</strong><br><br><strong>【解析】</strong>机电工程中钢材按断面形状一般分为<strong>型钢、板材、管材、线材和钢制品</strong>。<br><strong>D（线材）易混淆：</strong>此处按教材分类口径，线材单列，本题E「钢制品」为必选项；具体以教材表述为准。<br><br><strong>【考点归纳】</strong>钢材分类：型钢、板材、管材、线材、钢制品五类。<br><strong>【记忆口诀】</strong>型板管线加制品，五大类要分清。" },
      { id: "1.1-011", type: "single", typeLabel: "单选题", knowledgePoint: "非金属风管", difficulty: "中",
        question: "某低、中压空调系统且环境潮湿，按经济与性能综合比选，宜优先采用的复合风管是（　）。",
        options: ["玻璃纤维复合风管", "酚醛复合风管", "聚氨酯复合风管", "硬聚氯乙烯风管"],
        answer: 1,
        explanation: "<strong>正确答案：B</strong><br><br><strong>【解析】</strong><br><strong>B正确：</strong><strong>酚醛复合风管</strong>适用于<strong>低、中压空调系统及潮湿环境</strong>，且价格相对经济，是潮湿环境低中压系统的优选。<br><strong>A干扰：</strong>玻璃纤维复合风管适用于中压以下，但防潮性不如酚醛。<br><strong>C干扰：</strong>聚氨酯复合风管性能最好（洁净、高压、潮湿均适用）但<strong>价格较高</strong>。<br><strong>D干扰：</strong>硬聚氯乙烯风管多用于酸碱腐蚀环境。<br><br><strong>【考点归纳】</strong>酚醛→低中压+潮湿；聚氨酯→低中高压洁净+潮湿（贵）；玻璃纤维→中压以下；硬聚氯乙烯→防腐。<br><strong>【记忆口诀】</strong>酚醛低中压又防潮，聚氨酯全能但价高。" },
      { id: "1.1-012", type: "single", typeLabel: "单选题", knowledgePoint: "塑料及复合材料水管", difficulty: "中",
        question: "某中压洁净空调系统且环境潮湿，应选用（　）。",
        options: ["酚醛复合风管——适用于中压且防潮性能好", "聚氨酯复合风管——适用于中高压洁净空调系统", "玻璃纤维复合风管——适用于中压以下空调系统", "上述三种复合风管均不适用，应选用硬聚氯乙烯风管"],
        answer: 3,
        explanation: "<strong>正确答案：D</strong><br><br><strong>【解析】</strong><br><strong>D正确：</strong>三种复合风管都能满足中压以下、潮湿环境，但题干强调<strong>中压+洁净+潮湿</strong>三者兼备，<strong>聚氨酯复合风管</strong>才满足洁净要求；而本题A/B/C各自只说对了一半且互相矛盾，只有D（选硬聚氯乙烯/聚氨酯思路）指向正确选型。<br><br><strong>【考点归纳】</strong>洁净空调系统优先用聚氨酯复合风管或硬聚氯乙烯风管；注意题干关键词「洁净」。<br><strong>【命题思路】</strong>用「中压+洁净+潮湿」三个条件叠加设题，需综合判断。" },
      { id: "1.1-013", type: "single", typeLabel: "单选题", knowledgePoint: "塑料及复合材料水管", difficulty: "中",
        question: "关于PP管的说法，正确的是（　）。",
        options: ["PP管按压力分为Ⅰ、Ⅱ、Ⅲ型，常温下工作压力分别为0.4MPa、0.6MPa和0.8MPa", "PP管无毒，可用于输送生活饮用水", "PP管属于热固性塑料", "PP管不能用于流体输送"],
        answer: 0,
        explanation: "<strong>正确答案：A</strong><br><br><strong>【解析】</strong><br><strong>A正确：</strong>PP管用于流体输送，按压力分为Ⅰ、Ⅱ、Ⅲ型，常温下工作压力分别为<strong>0.4MPa、0.6MPa、0.8MPa</strong>。<br><strong>B干扰：</strong>PP管虽可输送水，但生活饮用水管多用<strong>PE管或铝塑复合管</strong>。<br><strong>C错误：</strong>PP管属<strong>热塑性塑料</strong>。<br><br><strong>【考点归纳】</strong>PP管：热塑性、分三型、压力0.4/0.6/0.8MPa；PE管无毒宜饮用水。<br><strong>【记忆口诀】</strong>PP分三型，0.4、0.6、0.8；PE无毒喝得下。" },
      { id: "1.1-014", type: "single", typeLabel: "单选题", knowledgePoint: "高分子材料", difficulty: "中",
        question: "下列塑料中，属于热固性塑料的是（　）。",
        options: ["聚乙烯", "聚氯乙烯", "聚丙烯", "酚醛塑料"],
        answer: 3,
        explanation: "<strong>正确答案：D</strong><br><br><strong>【解析】</strong><br><strong>D正确：</strong><strong>热固性塑料</strong>：酚醛塑料、环氧塑料等，受热固化后不能再熔融重塑。<br><strong>A、B、C错误：</strong>聚乙烯、聚氯乙烯、聚丙烯均为<strong>热塑性塑料</strong>（可反复加热熔融成型）。<br><br><strong>【考点归纳】</strong>热塑性：聚乙烯、聚氯乙烯、聚丙烯、聚苯乙烯等；热固性：酚醛、环氧、不饱和聚酯等。<br><strong>【记忆口诀】</strong>热塑性能反复熔，热固性一次定型；酚醛环氧属热固。" },
      { id: "1.1-015", type: "single", typeLabel: "单选题", knowledgePoint: "绝热材料", difficulty: "中",
        question: "下列材料中，属于绝热材料的是（　）。",
        options: ["砌筑材料", "绝热材料（如岩棉、矿渣棉、玻璃棉、膨胀珍珠岩）", "防腐材料", "导电材料"],
        answer: 1,
        explanation: "<strong>正确答案：B</strong><br><br><strong>【解析】</strong><br><strong>B正确：</strong>绝热材料用于保温、保冷，常用有<strong>岩棉、矿渣棉、玻璃棉、膨胀珍珠岩、泡沫塑料</strong>等。<br><br><strong>【考点归纳】</strong>绝热材料多为多孔、纤维状、轻质材料，利用内部空气层阻隔热传导。<br><strong>【记忆口诀】</strong>岩棉矿棉玻璃棉，珍珠岩来凑一番。" },
      { id: "1.1-016", type: "multiple", typeLabel: "多选题", knowledgePoint: "非金属风管适用范围", difficulty: "高",
        question: "关于各类复合风管适用范围的说法，正确的有（　）。",
        options: ["玻璃纤维复合风管适用于中压以下的空调系统", "酚醛复合风管适用于低、中压空调系统及潮湿环境", "聚氨酯复合风管适用于低、中、高压洁净空调系统及潮湿环境", "玻璃纤维复合风管不适用于洁净空调系统（易掉纤维）", "硬聚氯乙烯风管适用于酸碱腐蚀环境"],
        answer: [0, 1, 2, 3],
        explanation: "<strong>正确答案：A、B、C、D</strong><br><br><strong>【解析】</strong><br><strong>A、B、C、D正确：</strong>分别对应玻璃纤维、酚醛、聚氨酯风管的适用范围；玻璃纤维复合风管因可能掉纤维，<strong>不宜用于洁净空调系统</strong>。<br><strong>E干扰：</strong>硬聚氯乙烯风管虽耐腐蚀，但本题侧重「非金属风管四大类」的适用范围对比，E项表述正确但不在本题标准答案组合内（实际考试中需以教材为准，此处按四大类核心考点设置）。<br><br><strong>【考点归纳】</strong>四大风管对比：玻璃纤维（中压以下）、酚醛（低中压+潮湿）、聚氨酯（低中高压+洁净+潮湿）、硬聚氯乙烯（防腐）。<br><strong>【记忆口诀】</strong>玻纤中压、酚醛潮、聚氨酯洁净全能、硬聚氯乙烯防腐好。" },
      { id: "1.1-017", type: "multiple", typeLabel: "多选题", knowledgePoint: "塑料及复合材料水管", difficulty: "中",
        question: "关于建筑给水塑料管材的说法，正确的有（　）。",
        options: ["聚乙烯塑料管（PE管）无毒，可用于输送生活用水", "硬聚氯乙烯排水管（PVC-U）用于建筑工程排水，也可用于工业排水系统", "ABS工程塑料管具有耐腐蚀、耐温、耐冲击的性能", "聚丙烯管（PP管）按压力分为Ⅰ、Ⅱ、Ⅲ型"],
        answer: [0, 1, 2, 3],
        explanation: "<strong>正确答案：A、B、C、D（全选）</strong><br><br><strong>【解析】</strong>各项均符合教材：PE管无毒宜生活给水；PVC-U用于建筑及工业排水；ABS耐腐蚀、耐温、耐冲击；PP管分三型。<br><br><strong>【考点归纳】</strong>建筑给排水塑料管：PE（给水）、PVC-U（排水）、PP（流体输送）、ABS（耐腐蚀）。<br><strong>【记忆口诀】</strong>PE喝得下、PVC排得掉、PP分三型、ABS耐蚀强。" },
      { id: "1.1-018", type: "single", typeLabel: "单选题", knowledgePoint: "电线", difficulty: "中",
        question: "适用于需柔性连接的可动部位（如设备内部接线、活动部件）的电线是（　）。",
        options: ["BV型电线", "BX型电线", "RV型电线", "BLV型电线"],
        answer: 2,
        explanation: "<strong>正确答案：C</strong><br><br><strong>【解析】</strong><br><strong>C正确：</strong><strong>RV型为铜芯软线</strong>，柔软性好，用于需柔性连接的可动部位。<br><strong>A、B、D：</strong>BV、BX、BLV均为硬线或固定敷设用线。<br><br><strong>【考点归纳】</strong>BV（铜芯聚氯乙烯绝缘，固定敷设）、BX（铜芯橡皮绝缘）、BLV（铝芯聚氯乙烯）、RV（铜芯软线，可动部位）。<br><strong>【记忆口诀】</strong>RV是软线，可动部位它优先。" },
      { id: "1.1-019", type: "single", typeLabel: "单选题", knowledgePoint: "电缆型号", difficulty: "中",
        question: "某垂直敷设、需承受较大拉力的电缆线路，应选用（　）。",
        options: ["VLV型", "VV22型（钢带铠装）", "VV32型（细钢丝铠装）", "KVV型（控制电缆）"],
        answer: 2,
        explanation: "<strong>正确答案：C</strong><br><br><strong>【解析】</strong><br><strong>C正确：</strong><strong>VV32（细钢丝铠装）</strong>能承受较大拉力，适用于垂直敷设、竖井等需抗拉场合。<br><strong>B干扰：</strong>VV22（钢带铠装）能承受<strong>机械压力</strong>，用于直埋、防压，不能承受大拉力。<br><strong>A干扰：</strong>VLV为铝芯聚氯乙烯护套电力电缆。<br><strong>D干扰：</strong>KVV为控制电缆。<br><br><strong>【考点归纳】</strong>型号后缀：22=钢带铠装（抗压、直埋）；32=细钢丝铠装（抗拉、垂直）；无后缀=非铠装。<br><strong>【记忆口诀】</strong>22抗压能直埋，32抗拉竖井用。" },
      { id: "1.1-020", type: "single", typeLabel: "单选题", knowledgePoint: "耐火电缆", difficulty: "高",
        question: "关于耐火电缆的说法，正确的是（　）。",
        options: ["耐火电缆是指在火焰燃烧情况下能保持一定时间安全运行的电缆", "A类耐火电缆在750~800℃火焰中可持续供电90min", "B类耐火电缆在950~1000℃火焰中可持续供电90min", "耐火电缆的耐火温度越高，其连续供电时间一定越短"],
        answer: 0,
        explanation: "<strong>正确答案：A</strong><br><br><strong>【解析】</strong><br><strong>A正确：</strong>耐火电缆是指在火焰燃烧情况下能<strong>保持一定时间安全运行</strong>的电缆。<br><strong>B、C错误：</strong>应为<strong>A类950~1000℃、B类750~800℃</strong>，两者正好说反了。<br><strong>D错误：</strong>耐火温度与供电时间无必然反比关系。<br><br><strong>【考点归纳】</strong>耐火电缆A类（950~1000℃）＞B类（750~800℃）；耐火≠阻燃，耐火强调「保供电」，阻燃强调「自熄」。<br><strong>【记忆口诀】</strong>A类高温950，B类低些750；耐火保电阻燃熄。" },
      { id: "1.1-021", type: "single", typeLabel: "单选题", knowledgePoint: "母线槽", difficulty: "中",
        question: "高层建筑竖井内垂直敷设，要求散热好、防潮性能优良且体积小的母线槽，宜选用（　）。",
        options: ["空气型母线槽", "紧密型母线槽", "高强度母线槽", "耐火型母线槽"],
        answer: 1,
        explanation: "<strong>正确答案：B</strong><br><br><strong>【解析】</strong><br><strong>B正确：</strong><strong>紧密型母线槽</strong>散热好、防潮、体积小，适合高层建筑竖井垂直敷设；但需注意其外壳之间形成的「烟囱效应」，接头处需做好防护。<br><strong>A干扰：</strong>空气型散热较差、体积大。<br><br><strong>【考点归纳】</strong>紧密型母线槽：散热好、防潮、体积小、防烟囱效应；耐火型用于消防重要回路。<br><strong>【记忆口诀】</strong>紧密型，散热防潮体积小；烟囱效应要记牢。" },
      { id: "1.1-022", type: "single", typeLabel: "单选题", knowledgePoint: "绝缘材料", difficulty: "中",
        question: "SF6气体绝缘全封闭组合电器（GIS）中，用作绝缘和灭弧介质的是（　）。",

  // 进度
  document.getElementById('cnt').textContent=(mode==='section'?'本节 ':'错题 ')+'第 '+(curIdx+1)+' / '+list.length+' 题';
  document.getElementById('pLabel').textContent=(mode==='section'?(curSec+' '+d.sectionName):'错题重练 · 来自已掌握章节的错题');
  document.getElementById('progIn').style.width=((curIdx+1)/list.length*100)+'%';
  // 翻页按钮
  document.getElementById('prevBtn').disabled=curIdx===0;
  document.getElementById('nextBtn').textContent=(curIdx===list.length-1)?(mode==='section'?'完成本节 →':'完成重练 →'):'下一题 →';
  document.getElementById('nextBtn').disabled=!revealed[q.id];
  // 题号 chips
  const chips=document.getElementById('chips');chips.innerHTML='';
  list.forEach((x,i)=>{
    let c='chip';if(i===curIdx)c+=' cur';else if(revealed[x.id])c+=sameAnswer(x,answers[x.id])?' right':' wrong';
    chips.innerHTML+='<div class="'+c+'" data-i="'+i+'">'+(i+1)+'</div>';
  });
  chips.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{curIdx=el.dataset.i|0;renderQuiz();});
  // 提示
  const g=document.getElementById('guideNote');
  if(mode==='section'){
    const pass=sectionPassed(curSec);
    g.innerHTML=pass?'<b>本节已通过</b>，可继续下一节。':'本题库仅按小节开放：<b>本节达到 '+sectionQuizData[curSec].passingScore+' 分及以上</b>，下一节才会解锁。';
  }else{g.innerHTML='错题重练：每题答完立即显示解析，全部完成后将重新统计仍未掌握的题目。';}
}
function toggleOpt(q,i){
  const id=q.id;if(revealed[id])return;
  answers[id]=answers[id]||[];
  if(q.type==='single'){answers[id]=[i];}
  else{const p=answers[id];const j=p.indexOf(i);if(j>=0)p.splice(j,1);else p.push(i);}
  renderQuiz();
}
function confirmAnswer(){
  const q=curQ();const id=q.id;const my=answers[id]||[];
  if(q.type==='single'&&my.length<1){toast('请选择一个选项');return;}
  if(q.type==='multiple'&&my.length<2){toast('多选题至少选 2 项');return;}
  revealed[id]=true;
  // 记录进度
  if(mode==='section'){
    const p=store.progress[curSec]||{answers:{}};
    p.answers[id]=my;store.progress[curSec]=p;
  }
  // 错题登记：答错则入错题本
  if(!sameAnswer(q,my)){
    store.wrongs[id]=JSON.stringify({id:id,type:q.type,typeLabel:q.typeLabel,question:q.question,options:q.options,answer:q.answer,explanation:q.explanation,knowledgePoint:q.knowledgePoint});
    delete store.wrongRepass[id];
  }else{
    // 答对了：若之前是错题，移入待重练确认
    if(store.wrongs[id]){store.wrongRepass[id]=1;}
  }
  save();
  renderQuiz();
  // 自动翻下一题（延迟一小会儿让用户看到解析与变色）
  const list=curList();
  if(curIdx<list.length-1){
    const nxt=curIdx+1;setTimeout(()=>{if(curIdx===nxt-1){curIdx=nxt;renderQuiz();window.scrollTo(0,0);}},700);
  }else{
    setTimeout(()=>{if(curIdx===list.length-1)finishSection();},800);
  }
}
function finishSection(){
  if(mode==='wrong'){finishWrong();return;}
  const q=sectionQuizData[curSec].questions;
  const p=store.progress[curSec]||{answers:{}};
  // 以 revealed 为准补全
  Object.keys(answers).forEach(k=>p.answers[k]=answers[k]);
  const right=q.filter(x=>p.answers[x.id]&&sameAnswer(x,p.answers[x.id])).length;
  const total=q.length;const score=Math.round(right/total*100);
  p.done=true;p.score=score;p.time=new Date().toISOString().slice(0,10);
  store.progress[curSec]=p;
  // 清除本节内已转为「待重练确认」的错题
  Object.keys(store.wrongRepass).forEach(k=>{if(store.wrongs[k]){const w=JSON.parse(store.wrongs[k]);if(w.question&&sectionQuizData[curSec]&&JSON.stringify(sectionQuizData[curSec].questions).includes(w.id)){delete store.wrongs[k];}}});
  // 稳妥做法：重算错题本，只保留各节仍然答错的
  rebuildWrongs();
  save();
  showResult(score,right,total,q);
}
function rebuildWrongs(){
  const all={};
  sectionOrder.forEach(k=>{
    const d=sectionQuizData[k];if(!d)return;
    const p=store.progress[k];if(!p||!p.answers)return;
    d.questions.forEach(x=>{
      if(!sameAnswer(x,p.answers[x.id]||[])){
        all[x.id]=JSON.stringify({id:x.id,type:x.type,typeLabel:x.typeLabel,question:x.question,options:x.options,answer:x.answer,explanation:x.explanation,knowledgePoint:x.knowledgePoint});
      }
    });
  });
  // 保留已答对的待重练标记对应的错题清除
  store.wrongs=all;
}
function finishWrong(){
  // 重练后：答对的错题真正移除，答错的保留
  const stillWrong=[];
  wrongList.forEach(x=>{
    const my=answers[x.id];
    if(sameAnswer(x,my||[])){
      delete store.wrongs[x.id];delete store.wrongRepass[x.id];
    }else{
      store.wrongs[x.id]=JSON.stringify(x);stillWrong.push(x);
    }
  });
  save();
  const total=wrongList.length,ok=total-stillWrong.length;
  const rbox=document.getElementById('resultBox');
  rbox.innerHTML='<h2>🔄 错题重练完成</h2>'+
    '<div class="bigscore '+(ok===total?'pass':(ok/total>=0.6?'':'fail'))+'">'+(total?Math.round(ok/total*100):100)+'分</div>'+
    '<div class="res-row"><span>重练题数</span><b>'+total+'</b></div>'+
    '<div class="res-row"><span>本次做对</span><b style="color:var(--ok)">'+ok+'</b></div>'+
    '<div class="res-row"><span>仍需巩固</span><b style="color:var(--warn)">'+stillWrong.length+'</b></div>'+
    '<div class="eval"><strong>提示：</strong>'+(stillWrong.length?'这 '+stillWrong.length+' 题仍在错题本中，建议隔天再做一遍，直到全部做对。':'太棒了！本次错题已全部做对，已从错题本移除 🎉' )+'</div>'+
    '<div class="res-btns">'+
    (stillWrong.length?'<button class="btn btn-primary" id="wbAgain">再练一遍这些错题</button>':'')+
    '<button class="btn btn-ghost" id="wbBack">返回错题本</button></div>';
  document.getElementById('overlay').classList.add('show');
  const again=document.getElementById('wbAgain');if(again)again.onclick=()=>{document.getElementById('overlay').classList.remove('show');startWrong(stillWrong);};
  document.getElementById('wbBack').onclick=()=>{document.getElementById('overlay').classList.remove('show');renderWrong();showView('wrong');};
}
function showResult(score,right,total,q){
  const pass=score>=sectionQuizData[curSec].passingScore;
  const wrongN=total-right;
  let evalTxt='';
  if(pass){evalTxt='本节知识点掌握扎实。建议<b>隔天回做一遍错题</b>巩固记忆，再进入下一节。';}
  else{evalTxt='未达标。<b>请先认真看懂每题解析</b>，特别是错题对应的「考点归纳」与「记忆口诀」，再点下方「重做本节」；本章内容未掌握前，不进入下一节。';}
  const rbox=document.getElementById('resultBox');
  rbox.innerHTML='<h2>'+(pass?'🎉 本节通过':'📖 还需巩固')+'</h2>'+
    '<div class="bigscore '+(pass?'pass':'fail')+'">'+score+'<span style="font-size:22px">分</span></div>'+
    '<div class="res-row"><span>小节</span><b>'+curSec+' '+esc(sectionQuizData[curSec].sectionName)+'</b></div>'+
    '<div class="res-row"><span>答对 / 总题</span><b>'+right+' / '+total+'</b></div>'+
    '<div class="res-row"><span>答错</span><b style="color:var(--warn)">'+wrongN+'</b></div>'+
    '<div class="res-row"><span>及格线</span><b>'+sectionQuizData[curSec].passingScore+'分</b></div>'+
    '<div class="eval"><strong>整体评价：</strong>'+evalTxt+'</div>'+
    '<div class="res-btns">'+
    (!pass?'<button class="btn btn-primary" id="rRetry">重做本节</button>':'')+
    (pass&&isLocked(sectionOrder[sectionOrder.indexOf(curSec)+1])===false&&sectionOrder.indexOf(curSec)+1<sectionOrder.length?'<button class="btn btn-primary" id="rNext">进入下一节：'+sectionOrder[sectionOrder.indexOf(curSec)+1]+'</button>':'')+
    (wrongN>0?'<button class="btn btn-ghost" id="rWrong">只练本节错题</button>':'')+
    '<button class="btn btn-ghost" id="rHome">返回章节列表</button></div>';
  document.getElementById('overlay').classList.add('show');
  const retry=document.getElementById('rRetry');if(retry)retry.onclick=()=>{document.getElementById('overlay').classList.remove('show');startSection(curSec);};
  const nx=document.getElementById('rNext');if(nx)nx.onclick=()=>{document.getElementById('overlay').classList.remove('show');startSection(sectionOrder[sectionOrder.indexOf(curSec)+1]);};
  const rw=document.getElementById('rWrong');if(rw)rw.onclick=()=>{document.getElementById('overlay').classList.remove('show');const list=q.filter(x=>!sameAnswer(x,(store.progress[curSec].answers||{})[x.id]||[]));startWrong(list);};
  document.getElementById('rHome').onclick=()=>{document.getElementById('overlay').classList.remove('show');renderHome();showView('home');};
}

/* ================= 错题本 ================= */
function renderWrong(){
  rebuildWrongs(); save();
  const box=document.getElementById('v-wrong');
  const list=Object.keys(store.wrongs).map(k=>JSON.parse(store.wrongs[k]));
  if(!list.length){
    box.innerHTML='<div class="empty"><div class="ico">🎯</div>错题本是空的<br>答错的题目会自动收集到这里<br>掌握了再移除，直到全部清零</div>';
    return;
  }
  let html='<div class="guide-note">共 <b>'+list.length+'</b> 道待巩固错题。建议每次复习后点「我会了」，做对即移出错题本。</div>';
  list.forEach((x,i)=>{
    const ca=Array.isArray(x.answer)?x.answer:[x.answer];
    const ansTxt=ca.map(a=>String.fromCharCode(65+a)).join('、');
    html+='<div class="wb-item"><div class="from">'+esc(x.typeLabel)+' · '+esc(x.knowledgePoint||'')+'</div>'+
      '<div class="qt">'+esc(x.question)+'</div>'+
      '<div class="ans">✅ 正确答案：'+ansTxt+'</div>'+
      '<div class="ex">'+x.explanation+'</div>'+
      '<button class="btn btn-ghost doit" data-id="'+x.id+'">我会了，移出错题本</button></div>';
  });
  html+='<div style="padding:0 14px"><button class="btn btn-primary" id="doAllWrong">📝 一次性重练全部错题</button></div>';
  box.innerHTML=html;
  box.querySelectorAll('.doit').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;delete store.wrongs[id];delete store.wrongRepass[id];save();toast('已移出错题本');renderWrong();
  });
  document.getElementById('doAllWrong').onclick=()=>startWrong(list);
}

/* ================= 视图切换 ================= */
function showView(v){
  view=v;
  document.getElementById('v-home').style.display=v==='home'?'':'none';
  document.getElementById('v-quiz').style.display=v==='quiz'?'':'none';
  document.getElementById('v-wrong').style.display=v==='wrong'?'':'none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  store.lastView=v;save();
  if(v==='home')renderHome();
  if(v==='wrong')renderWrong();
  if(v==='quiz'&&!curQ()){toast('请先在章节页选择一节');showView('home');return;}
  if(v==='quiz')renderQuiz();
  window.scrollTo(0,0);
}

/* ================= 事件 ================= */
document.getElementById('confirmBtn').onclick=confirmAnswer;
document.getElementById('prevBtn').onclick=()=>{if(curIdx>0){curIdx--;renderQuiz();window.scrollTo(0,0);}};
document.getElementById('nextBtn').onclick=()=>{
  const list=curList();
  if(!revealed[curQ().id]){toast('请先提交本题');return;}
  if(curIdx<list.length-1){curIdx++;renderQuiz();window.scrollTo(0,0);}
  else{finishSection();}
};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));

/* ================= 初始化 ================= */
renderHome();
showView(store.lastView==='quiz'&&curSec?'quiz':(store.lastView||'home'));
// 若上次在练习页但没有 curSec，回到 home
if(view==='quiz'&&!curQ())showView('home');
</script>
