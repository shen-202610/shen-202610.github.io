<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a5fb4">
<title>二建机电 · 分章节刷题</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--blue:#1a5fb4;--blue2:#4a90d9;--bg:#f4f6fa;--card:#fff;--ok:#2e8b57;--warn:#c0392b;--line:#e5e9f0;--txt:#1c2430;--sub:#66727f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:0 0 72px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:9px 14px 8px;box-shadow:0 1px 8px rgba(0,0,0,.12)}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h-top h1{font-size:15.5px;margin:0;font-weight:700}
.badge{font-size:11px;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:20px;white-space:nowrap}
.progress-outer{margin-top:5px;height:4px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
.progress-inner{height:100%;width:0;background:#ffd666;transition:width .3s}
.p-label{font-size:10px;margin-top:3px;opacity:.92}
.tabs{display:flex;gap:6px;padding:8px 10px;background:var(--card);position:sticky;top:64px;z-index:15;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{flex:1;min-width:72px;text-align:center;font-size:13px;padding:6px 2px;border-radius:8px;background:var(--bg);color:var(--sub);cursor:pointer;transition:.2s;border:1px solid transparent;user-select:none}
.tab.active{background:var(--blue);color:#fff;font-weight:600}
.tab.err{background:#fdecea;color:var(--warn);border-color:#f5c6cb}
.card{background:var(--card);margin:10px 12px;border-radius:14px;padding:14px 13px;box-shadow:0 1px 8px rgba(20,40,80,.06)}
.qmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:11px;padding:1px 7px;border-radius:20px;background:#eaf2fd;color:var(--blue);font-weight:600}
.tag.multi{background:#fef3e2;color:#d97706}
.tag.kp{background:#f0f4f8;color:var(--sub);font-weight:400}
.tag.diff{background:#eefaf3;color:var(--ok)}
.tag.done{background:#e9ecef;color:#495057}
.tag.err{background:#fdecea;color:var(--warn)}
.qtext{font-size:15.5px;font-weight:600;line-height:1.6;margin:4px 0 12px}
.opt{border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:4px;cursor:pointer;transition:.15s;display:flex;gap:6px;align-items:flex-start;user-select:none}
.opt .no{flex:none;width:18px;height:18px;border-radius:50%;background:var(--bg);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;margin-top:1px}
.opt .opt-txt{font-size:13.5px;line-height:1.5}
.opt.sel{border-color:var(--blue);background:#f0f6ff}
.opt.sel .no{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--ok);background:#eefaf3}
.opt.ok .no{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--warn);background:#fdecea}
.opt.bad .no{background:var(--warn);color:#fff}
.opt.disabled{pointer-events:none;opacity:.9}
.opt-txt{font-size:14px;line-height:1.5}
.exp{margin-top:10px;padding:11px;border-radius:10px;background:#f7f9fc;border-left:4px solid var(--blue);font-size:13.5px;line-height:1.65;display:none}
.exp.show{display:block}
.exp strong{color:var(--blue)}
.btn{display:inline-block;border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:var(--blue);color:#fff;width:100%}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:#b8c6d8;cursor:not-allowed}
.btn-ghost{background:var(--bg);color:var(--blue);border:1px solid var(--blue)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 12px 0}
.pager .btn{flex:1}
.pager .btn:disabled{opacity:.4}
.cnt{text-align:center;font-size:12px;color:var(--sub);margin:10px 0 2px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 12px;justify-content:center}
.chip{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--bg);color:var(--sub);cursor:pointer;border:1.5px solid transparent}
.chip.cur{border-color:var(--blue);background:#eaf2fd}
.chip.right{background:#eefaf3;color:var(--ok)}
.chip.wrong{background:#fdecea;color:var(--warn)}
.chip.done{background:#eaf2fd;color:var(--blue)}
/* 首页 / 章节选择 */
.chapter{background:var(--card);margin:8px 12px;border-radius:12px;padding:11px;box-shadow:0 1px 6px rgba(20,40,80,.05);cursor:pointer;transition:.15s;border:1.5px solid transparent}
.chapter:active{transform:scale(.99)}
.chapter.locked{opacity:.55;cursor:not-allowed}
.chapter-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chapter-title{font-weight:700;font-size:14.5px}
.chapter-title small{display:block;font-weight:400;font-size:11px;color:var(--sub);margin-top:2px}
.ch-state{font-size:11px;white-space:nowrap;padding:2px 7px;border-radius:20px}
.st-new{background:#eaf2fd;color:var(--blue)}
.st-doing{background:#fef3e2;color:#d97706}
.st-pass{background:#eefaf3;color:var(--ok)}
.st-lock{background:#eceff3;color:#95a0ac}
.mini-bar{margin-top:7px;height:4px;background:var(--bg);border-radius:4px;overflow:hidden}
.mini-bar>i{display:block;height:100%;background:var(--ok);border-radius:4px}
/* 成绩弹层 */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
.overlay.show{display:flex}
.result{background:#fff;border-radius:16px;width:100%;max-width:400px;padding:18px 16px;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.result h2{margin:0 0 4px;text-align:center;font-size:19px}
.bigscore{text-align:center;font-size:40px;font-weight:800;color:var(--blue);line-height:1.1;margin:6px 0}
.bigscore.pass{color:var(--ok)}
.bigscore.fail{color:var(--warn)}
.res-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.res-row b{color:var(--blue)}
.eval{background:#f7f9fc;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13.5px;line-height:1.6}
.eval strong{color:var(--blue)}
.res-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
/* 错题本 */
.empty{text-align:center;color:var(--sub);padding:30px 12px;font-size:14px}
.empty .ico{font-size:36px;margin-bottom:8px}
.wb-item{background:var(--card);margin:8px 12px;border-radius:12px;padding:11px;border-left:5px solid var(--warn);box-shadow:0 1px 6px rgba(20,40,80,.05)}
.wb-item .from{font-size:11px;color:var(--sub);margin-bottom:4px}
.wb-item .qt{font-weight:600;font-size:14.5px;margin-bottom:6px}
.wb-item .ans{font-size:13.5px;color:var(--ok);margin-bottom:2px}
.wb-item .ex{font-size:13px;color:var(--sub);line-height:1.6}
.wb-item .doit{margin-top:8px;font-size:13px;padding:6px 14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(20,30,45,.92);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
footer{text-align:center;color:var(--sub);font-size:11px;padding:14px 16px 28px;line-height:1.6}
.guide-note{background:#fff8e6;border:1px solid #ffe08a;color:#8a6d1a;font-size:12.5px;margin:8px 12px;padding:9px 12px;border-radius:10px;line-height:1.55}
/* 子页面顶栏（练题/错题单题复习） */
.subnav{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;gap:8px;padding:10px 10px;box-shadow:0 1px 8px rgba(0,0,0,.12)}
.subnav .bk{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:5px 10px;font-size:14px;cursor:pointer;flex:none}
.subnav .bk:active{background:rgba(255,255,255,.32)}
.subnav .t{font-weight:700;font-size:15px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:44px}
/* 练题模式 */
.judge{margin-top:10px;padding:9px 11px;border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.5}
.judge.ok{background:#eefaf3;color:var(--ok)}
.judge.bad{background:#fdecea;color:var(--warn)}
.judge .sub{font-weight:400;font-size:12.5px;margin-top:3px;line-height:1.5}
.streak{margin-top:8px;padding:8px 11px;border-radius:10px;background:#fff8e6;border:1px solid #ffe08a;color:#8a6d1a;font-size:12.5px;line-height:1.5}
.streak.good{background:#eefaf3;border-color:#b8e0c5;color:var(--ok)}
.popt{background:var(--card);margin:8px 12px;border-radius:12px;padding:12px;box-shadow:0 1px 6px rgba(20,40,80,.05);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px solid transparent}
.popt:active{transform:scale(.99)}
.popt b{font-size:14.5px}
.popt span{font-size:12px;color:var(--sub)}
.popt .go{flex:none;font-size:12px;color:var(--blue);background:#eaf2fd;padding:2px 8px;border-radius:20px}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <h1>二建机电 · 分章节刷题</h1>
    <span class="badge" id="badge">第一篇</span>
  </div>
  <div class="progress-outer"><div class="progress-inner" id="progIn"></div></div>
  <div class="p-label" id="pLabel">湖南二建考试科目 · 全部小节自由开放</div>
</header>

<div class="tabs">
  <div class="tab active" data-view="home">📚 章节</div>
  <div class="tab" data-view="practice-home">✍️ 练题</div>
  <div class="tab err" data-view="wrong">📌 错题本</div>
  <div class="tab" data-view="record">📋 记录</div>
</div>

<div class="wrap">

  <!-- 首页：章节列表 -->
  <div id="v-home"></div>

  <!-- 练习区 -->
  <div id="v-quiz" style="display:none">
    <div class="card">
      <div class="qmeta" id="qmeta"></div>
      <div class="qtext" id="qtext"></div>
      <div id="optbox"></div>
      <div class="exp" id="exp"></div>
      <button class="btn btn-primary" id="confirmBtn" disabled>确认提交</button>
    </div>
    <div class="cnt" id="cnt"></div>
    <div class="chips" id="chips"></div>
    <div class="pager">
      <button class="btn btn-ghost" id="prevBtn">← 上一题</button>
      <button class="btn btn-primary" id="nextBtn">下一题 →</button>
    </div>
    <div class="guide-note" id="guideNote"></div>
  </div>

  <!-- 练题模式：范围选择 -->
  <div id="v-practice-home" style="display:none"></div>
  <!-- 练题模式：做题 -->
  <div id="v-practice" style="display:none"></div>

  <!-- 错题本 -->
  <div id="v-wrong"></div>

  <!-- 错题单题复习：独立页 -->
  <div id="v-wrong-detail" style="display:none"></div>

  <!-- 做题记录（记忆功能） -->
  <div id="v-record" style="display:none"></div>

</div>

<footer>数据按2024版教材知识点编写 · 题目与解析仅用于学习<br>本页自动保存在手机本地，重开可继续</footer>

<div class="overlay" id="overlay">
  <div class="result" id="resultBox"></div>
</div>

<div class="toast" id="toast"></div>

<script src="quiz-data.js"></script>
<script>
/* ================= 工具 ================= */
const LS_KEY='erjian_v2';
const store=Object.assign({progress:{},wrongs:{},lastView:'home',history:[]},(function(){
  try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch(e){return{}}
})());
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store))}catch(e){}}
/* 章节归位迁移：1.3/1.4/1.5 → 2.1/2.2/2.3（按2024版考试用书第二章归位） */
const SEC_MIGRATE={'1.3':'2.1','1.4':'2.2','1.5':'2.3'};
function migrateStore(){
  let changed=false;
  const pr=store.progress||{};
  Object.keys(SEC_MIGRATE).forEach(k=>{
    const nk=SEC_MIGRATE[k];
    if(pr[k]===undefined)return;
    const oldA=pr[k].answers||{};
    const remap={};
    Object.keys(oldA).forEach(qid=>{
      const nqid=qid.replace(new RegExp('^'+k.replace('.','\\.')+'-'),nk+'-');
      remap[nqid]=oldA[qid];
    });
    if(pr[nk]===undefined){pr[nk]=pr[k];pr[nk].answers=remap;}
    else{
      const newA=pr[nk].answers||{};
      Object.keys(remap).forEach(qid=>{if(newA[qid]===undefined)newA[qid]=remap[qid];});
      pr[nk].answers=newA;
      pr[nk].done=pr[nk].done||pr[k].done;
      if(pr[nk].score===undefined)pr[nk].score=pr[k].score;
      if(!pr[nk].time)pr[nk].time=pr[k].time;
    }
    delete pr[k];changed=true;
  });
  const wb=store.wrongs||{};
  Object.keys(wb).forEach(id=>{
    const m=id.match(/^1\.[345]-(.*)$/);
    if(!m)return;
    const nid=SEC_MIGRATE[id.slice(0,3)]+'-'+m[1];
    if(wb[nid]===undefined){
      try{const w=JSON.parse(wb[id]);w.id=nid;wb[nid]=JSON.stringify(w);}catch(e){wb[nid]=wb[id];}
    }
    delete wb[id];changed=true;
  });
  if(changed)save();
}
migrateStore();
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= 状态 ================= */
let view='home';
let curSec=null,curIdx=0; // 章节模式
let answers={};     // {qid: [idx,...]}
let answered={};    // {qid: true} 只标记已作答，不暴露对错
let multiTimer=null; // 多选自动翻页计时器

const allSections=sectionOrder.map(k=>({key:k,data:sectionQuizData[k]}));

/* ================= 章节首页 ================= */
function sectionPassed(key){
  const p=store.progress[key];
  if(!p||!p.done) return false;
  const q=sectionQuizData[key].questions;
  const right=q.filter(x=>p.answers&&p.answers[x.id]&&sameAnswer(x,p.answers[x.id])).length;
  return Math.round(right/q.length*100)>=sectionQuizData[key].passingScore;
}
function sameAnswer(q,a){ // a: [idx]
  const ca=Array.isArray(q.answer)?q.answer:[q.answer];
  return ca.length===a.length && ca.every(x=>a.includes(x));
}
function isLocked(){return false;} // 已取消顺序解锁：全部小节自由开放
function renderHome(){
  const box=document.getElementById('v-home');
  let html='';
  Object.keys(chapterMeta).forEach(ch=>{
    html+='<div style="margin:12px 12px 2px;font-size:12.5px;color:var(--sub);font-weight:600">'+esc(ch)+'</div>';
    chapterMeta[ch].forEach(key=>{
      const d=sectionQuizData[key];
      if(!d){return;}
      const lock=false;
      const p=store.progress[key];
      let state,bar='';
      if(lock){state='<span class="ch-state st-lock">🔒 需先通过上一节</span>';}
      else if(sectionPassed(key)){state='<span class="ch-state st-pass">✅ 已通过 '+p.score+'分</span>';bar='<div class="mini-bar"><i style="width:100%"></i></div>';}
      else if(p&&p.done){state='<span class="ch-state st-doing">↻ 未达标 '+p.score+'分 · 可重做</span>';bar='<div class="mini-bar"><i style="width:'+p.score+'%"></i></div>';}
      else if(p&&p.answers){const n=Object.keys(p.answers).length;state='<span class="ch-state st-doing">✎ 做了 '+n+'/'+d.questions.length+' 题</span>';bar='<div class="mini-bar"><i style="width:'+Math.round(n/d.questions.length*100)+'%"></i></div>';}
      else{state='<span class="ch-state st-new">🆕 未开始</span>';}
      html+='<div class="chapter'+(lock?' locked':'')+'" data-sec="'+key+'">'+
        '<div class="chapter-head"><div class="chapter-title">'+key+' '+esc(d.sectionName)+'<small>'+d.questions.length+'题 · 单选+多选 · 及格线'+d.passingScore+'分</small></div>'+state+'</div>'+bar+'</div>';
    });
  });
  box.innerHTML=html;
  box.querySelectorAll('.chapter').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.sec;
      startSection(k);
    };
  });
}

/* ================= 开始一节 ================= */
function startSection(key){
  if(!sectionQuizData[key]){toast('该小节数据暂未开放');renderHome();showView('home');return;}
  curSec=key;curIdx=0;answers={};answered={};
  const p=store.progress[key];
  if(p&&p.answers){
    Object.keys(p.answers).forEach(qid=>{answers[qid]=p.answers[qid];answered[qid]=true;});
  }
  showView('quiz');
}

/* ================= 渲染题目 ================= */
function curList(){return sectionQuizData[curSec]?sectionQuizData[curSec].questions:[];}
function curQ(){const l=curList();return l[Math.min(curIdx,l.length-1)];}
function renderQuiz(){
  const q=curQ();if(!q)return;
  const list=curList();
  // 顶部元信息
  const d=sectionQuizData[curSec];
  document.getElementById('qmeta').innerHTML=
    '<span class="tag'+(q.type==='multiple'?' multi':'')+'">'+q.typeLabel+'</span>'+
    '<span class="tag kp">'+esc(q.knowledgePoint||'')+'</span>'+
    '<span class="tag diff">'+esc(q.difficulty||'')+'</span>'+
    (answered[q.id]?'<span class="tag done">已作答</span>':'');
  document.getElementById('qtext').textContent=q.question;
  // 选项
  const my=answers[q.id]||[];
  const box=document.getElementById('optbox');
  box.innerHTML=q.options.map((o,i)=>{
    let cls='opt';let no=String.fromCharCode(65+i);
    if(my.includes(i)){cls+=' sel';}
    return '<div class="'+cls+'" data-i="'+i+'"><div class="no">'+no+'</div><div class="opt-txt">'+esc(o)+'</div></div>';
  }).join('');
  box.querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>toggleOpt(q,el.dataset.i|0);
  });
  // 解析
  const exp=document.getElementById('exp');
  exp.classList.remove('show');exp.innerHTML='';
  // 按钮（已改为选完自动翻页，确认按钮不再显示）
  const cBtn=document.getElementById('confirmBtn');
  cBtn.style.display='none';
  // 进度
  document.getElementById('cnt').textContent='本节 第 '+(curIdx+1)+' / '+list.length+' 题';
  document.getElementById('pLabel').textContent=curSec+' '+d.sectionName;
  document.getElementById('badge').textContent=curSec[0]==='2'?'第二章':'第一章';
  document.getElementById('progIn').style.width=((curIdx+1)/list.length*100)+'%';
  // 翻页按钮
  document.getElementById('prevBtn').disabled=curIdx===0;
  document.getElementById('nextBtn').textContent=(curIdx===list.length-1)?'完成本节 →':'下一题 →';
  document.getElementById('nextBtn').disabled=false;
  // 题号 chips
  const chips=document.getElementById('chips');chips.innerHTML='';
  list.forEach((x,i)=>{
    let c='chip';if(i===curIdx)c+=' cur';else if(answered[x.id])c+=' done';
    chips.innerHTML+='<div class="'+c+'" data-i="'+i+'">'+(i+1)+'</div>';
  });
  chips.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{curIdx=el.dataset.i|0;renderQuiz();});
  // 提示
  const g=document.getElementById('guideNote');
  const pass=sectionPassed(curSec);
  g.innerHTML=pass?'<b>本节已通过</b>，可继续下一节。':'全部答完后统一查看答案与解析；单选点选即自动下一题，多选勾满 2 项自动下一题。';
}
function toggleOpt(q,i){
  const id=q.id;
  answers[id]=answers[id]||[];
  if(q.type==='single'){
    // 单选：点选即记录并自动翻页（350ms 内仍可改选）
    answers[id]=[i];answered[id]=true;saveAnswer(q,answers[id]);renderQuiz();
    clearTimeout(multiTimer);
    setTimeout(()=>{if(curQ()===q){advanceNow();}},350);
  }else{
    const p=answers[id];const j=p.indexOf(i);
    if(j>=0)p.splice(j,1);else p.push(i);
    renderQuiz();
    // 多选：勾满 2 项后停止点击 900ms 自动翻页（可继续加选）
    if(p.length>=2){
      clearTimeout(multiTimer);
      multiTimer=setTimeout(()=>{if(curQ()===q&&answers[id]&&answers[id].length>=2){advanceNow();}},900);
    }
  }
}
function advanceNow(){
  const q=curQ();const my=answers[q.id]||[];
  if(!my.length){return;}
  answered[q.id]=true;
  saveAnswer(q,my);
  const list=curList();
  if(curIdx<list.length-1){
    const nxt=curIdx+1;
    setTimeout(()=>{if(curIdx===nxt-1){curIdx=nxt;renderQuiz();window.scrollTo(0,0);}},280);
  }else{
    setTimeout(()=>{if(curIdx===list.length-1)finishSection();},380);
  }
}
function saveAnswer(q,my){
  const p=store.progress[curSec]||{answers:{}};
  p.answers[q.id]=my;store.progress[curSec]=p;save();
}
function finishSection(){
  const q=sectionQuizData[curSec].questions;
  const p=store.progress[curSec]||{answers:{}};
  // 汇总本次作答
  Object.keys(answers).forEach(k=>p.answers[k]=answers[k]);
  const right=q.filter(x=>p.answers[x.id]&&sameAnswer(x,p.answers[x.id])).length;
  const total=q.length;const score=Math.round(right/total*100);
  p.done=true;p.score=score;p.time=new Date().toISOString().slice(0,10);
  store.progress[curSec]=p;
  // 记忆功能：记录本次每道已答题的作答
  const hist=store.history||[];
  const nowTs=new Date().toISOString();
  q.forEach(x=>{
    const my=p.answers[x.id];
    if(my===undefined)return;
    hist.push({ts:nowTs,sec:curSec,mode:'章节',qid:x.id,type:x.type,my:my.slice(),ok:sameAnswer(x,my)});
  });
  store.history=hist.slice(-3000);
  // 重算错题本：只保留各节仍然答错的
  rebuildWrongs();
  save();
  showResult(score,right,total,q);
}
function rebuildWrongs(){
  const all={};
  const old=store.wrongs||{};
  sectionOrder.forEach(k=>{
    const d=sectionQuizData[k];if(!d)return;
    const p=store.progress[k];if(!p||!p.answers)return;
    d.questions.forEach(x=>{
      if(p.answers[x.id]===undefined) return;
      if(!sameAnswer(x,p.answers[x.id]||[])){
        let streak=0;
        try{streak=JSON.parse(old[x.id]||'{}').okStreak||0;}catch(e){}
        all[x.id]=JSON.stringify({id:x.id,type:x.type,typeLabel:x.typeLabel,question:x.question,options:x.options,answer:x.answer,explanation:x.explanation,knowledgePoint:x.knowledgePoint,difficulty:x.difficulty,okStreak:streak});
      }
    });
  });
  // 保留已答对的待重练标记对应的错题清除
  store.wrongs=all;
}
function showResult(score,right,total,q){
  const pass=score>=sectionQuizData[curSec].passingScore;
  const wrongN=total-right;
  let evalTxt='';
  if(pass){evalTxt='本节知识点掌握扎实。建议<b>隔天回做一遍错题</b>巩固记忆，再进入下一节。';}
  else{evalTxt='未达标。<b>请先认真看下方每题解析</b>，特别是错题对应的「考点归纳」与「记忆口诀」，再点下方「重做本节」巩固。';}
  const p=store.progress[curSec]||{answers:{}};
  // 逐题解析
  let rvHtml='';
  q.forEach((x,i)=>{
    const my=p.answers[x.id]||[];
    const ca=Array.isArray(x.answer)?x.answer:[x.answer];
    const ok=my.length&&sameAnswer(x,my);
    rvHtml+='<div style="border-bottom:1px solid #eee;padding:8px 0;text-align:left">'+
      '<div style="font-weight:600;font-size:14px">'+(i+1)+'. '+esc(x.question)+' <span class="tag">'+x.typeLabel+'</span></div>'+
      '<div style="font-size:12.5px;margin:4px 0">你的答案：<b style="color:'+(ok?'var(--ok)':'var(--warn)')+'">'+(my.length?my.map(a=>String.fromCharCode(65+a)).join('、'):'未答')+'</b> ｜ 正确答案：<b style="color:var(--ok)">'+ca.map(a=>String.fromCharCode(65+a)).join('、')+'</b> '+(ok?'✅':'❌')+'</div>'+
      '<div style="font-size:12.5px;line-height:1.6;background:#f7f9fc;padding:8px;border-radius:8px">'+x.explanation+'</div></div>';
  });
  const rbox=document.getElementById('resultBox');
  rbox.innerHTML='<h2>'+(pass?'🎉 本节通过':'📖 还需巩固')+'</h2>'+
    '<div class="bigscore '+(pass?'pass':'fail')+'">'+score+'<span style="font-size:22px">分</span></div>'+
    '<div class="res-row"><span>小节</span><b>'+curSec+' '+esc(sectionQuizData[curSec].sectionName)+'</b></div>'+
    '<div class="res-row"><span>答对 / 总题</span><b>'+right+' / '+total+'</b></div>'+
    '<div class="res-row"><span>答错</span><b style="color:var(--warn)">'+wrongN+'</b></div>'+
    '<div class="res-row"><span>及格线</span><b>'+sectionQuizData[curSec].passingScore+'分</b></div>'+
    '<div class="eval"><strong>整体评价：</strong>'+evalTxt+'</div>'+
    '<div style="font-size:13px;font-weight:700;color:var(--blue);margin:10px 0 3px">📖 逐题解析（答错已自动收录到错题本）</div>'+
    '<div style="max-height:44vh;overflow:auto;margin:4px 0 12px">'+rvHtml+'</div>'+
    '<div class="res-btns">'+
    '<button class="btn btn-primary" id="rRetry">🔄 重做本节</button>'+
    (pass&&sectionOrder.indexOf(curSec)+1<sectionOrder.length?'<button class="btn btn-primary" id="rNext">进入下一节：'+sectionOrder[sectionOrder.indexOf(curSec)+1]+'</button>':'')+
    (wrongN>0?'<button class="btn btn-ghost" id="rWrong">只练本节错题</button>':'')+
    '<button class="btn btn-ghost" id="rHome">返回章节列表</button></div>';
  document.getElementById('overlay').classList.add('show');
  const retry=document.getElementById('rRetry');if(retry)retry.onclick=()=>{document.getElementById('overlay').classList.remove('show');startSection(curSec);};
  const nx=document.getElementById('rNext');if(nx)nx.onclick=()=>{document.getElementById('overlay').classList.remove('show');startSection(sectionOrder[sectionOrder.indexOf(curSec)+1]);};
  const rw=document.getElementById('rWrong');if(rw)rw.onclick=()=>{document.getElementById('overlay').classList.remove('show');const list=q.filter(x=>!sameAnswer(x,(store.progress[curSec].answers||{})[x.id]||[]));startPractice(list,curSec+' 错题');};
  document.getElementById('rHome').onclick=()=>{document.getElementById('overlay').classList.remove('show');renderHome();showView('home');};
}

/* ================= 错题本 ================= */
let wbList=[],wbIdx=0,sx0=null; // 错题单题复习页状态
function openWbView(list,idx){
  wbList=list.slice();wbIdx=idx;renderWbView();showView('wrong-detail');
}
function renderWbView(){
  const x=wbList[wbIdx];
  const ca=Array.isArray(x.answer)?x.answer:[x.answer];
  const ansTxt=ca.map(a=>String.fromCharCode(65+a)).join('、');

    const ok=ca.includes(i);

    '<div class="card">'+
      '<div class="qmeta">'+
        '<span class="tag'+(x.type==='multiple'?' multi':'')+'">'+esc(x.typeLabel)+'</span>'+
        '<span class="tag kp">'+esc(x.knowledgePoint||'')+'</span>'+
        '<span class="tag diff">'+esc(x.difficulty||'')+'</span>'+
        ((x.okStreak||0)>0?'<span class="tag done">🔥 连续答对 '+(x.okStreak||0)+'/3</span>':'')+
      '</div>'+
      '<div class="qtext">'+esc(x.question)+'</div>'+
      opts+
      '<div style="margin-top:10px;padding:9px 11px;border-radius:10px;background:#eefaf3;font-size:13.5px;color:var(--ok);font-weight:600">✅ 正确答案：'+ansTxt+'</div>'+
      '<div style="margin-top:8px;padding:11px;border-radius:10px;background:#f7f9fc;border-left:4px solid var(--blue);font-size:13.5px;line-height:1.65">'+x.explanation+'</div>'+
    '</div>'+
    '<div class="pager">'+
      '<button class="btn btn-ghost" id="wbPrev">← 上一题</button>'+
      '<button class="btn btn-ghost" id="wbDel" style="flex:1.4">✅ 我会了</button>'+
      '<button class="btn btn-primary" id="wbNext">下一题 →</button>'+
    '</div>';
  const pEl=document.getElementById('wbPrev');pEl.disabled=wbIdx===0;
  const nEl=document.getElementById('wbNext');nEl.disabled=wbIdx===wbList.length-1;
  pEl.onclick=()=>{wbIdx--;renderWbView();window.scrollTo(0,0);};
  nEl.onclick=()=>{wbIdx++;renderWbView();window.scrollTo(0,0);};
  document.getElementById('wbBack').onclick=()=>{renderWrong();showView('wrong');};
  document.getElementById('wbDel').onclick=()=>{
    const id=x.id;delete store.wrongs[id];save();toast('已移出错题本');
    wbList.splice(wbIdx,1);
    if(!wbList.length){renderWrong();showView('wrong');return;}
    if(wbIdx>=wbList.length)wbIdx=wbList.length-1;
    renderWbView();
  };
  // 左右滑动切换题目
  box.ontouchstart=e=>{sx0=e.touches[0].clientX;};
  box.ontouchend=e=>{
    if(sx0===null)return;
    const dx=e.changedTouches[0].clientX-sx0;
    if(dx<-45&&wbIdx<wbList.length-1){wbIdx++;renderWbView();}
    else if(dx>45&&wbIdx>0){wbIdx--;renderWbView();}
    sx0=null;
  };
}
function renderWrong(){
  const box=document.getElementById('v-wrong');
  const list=Object.keys(store.wrongs).map(k=>JSON.parse(store.wrongs[k]));
  if(!list.length){
    box.innerHTML='<div class="empty"><div class="ico">🎯</div>错题本是空的<br>章节答错或练题答错的题目会自动收集到这里<br>连续答对 3 次自动移除</div>';
    return;
  }
  let html='<div class="guide-note">共 <b>'+list.length+'</b> 道待巩固错题。点任意一题可单题复习（左右切题、上下滚动看解析）；进入「练题模式」每题即时判对错，<b>连续答对 3 次自动移出错题本</b>。</div>'+
    '<div style="padding:0 12px"><button class="btn btn-primary" id="doAllWrong">▶ 练题模式（每题即时判对错）</button></div>';
  list.forEach((x,i)=>{
    const ca=Array.isArray(x.answer)?x.answer:[x.answer];

      ((x.okStreak||0)>0?' · <b style="color:#d97706">🔥 连续答对 '+(x.okStreak||0)+'/3</b>':'')+'</div>'+
      '<div class="qt">'+esc(x.question)+'</div>'+
      '<div class="ans">✅ 正确答案：'+ansTxt+'</div>'+
      '<button class="btn btn-ghost doit" data-id="'+x.id+'">我会了，移出错题本</button></div>';
  });
  box.innerHTML=html;
  box.querySelectorAll('.doit').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id;delete store.wrongs[id];save();toast('已移出错题本');renderWrong();});
  box.querySelectorAll('.wb-item').forEach(el=>el.onclick=()=>openWbView(list,el.dataset.idx|0));
  document.getElementById('doAllWrong').onclick=()=>startPractice(list,'错题本专练');
}

/* ================= 练题模式（每题即时判对错） ================= */
let pList=[],pIdx=0,pResults={},pRange='',pSel={},pSx=null;
function renderPracticeHome(){
  const box=document.getElementById('v-practice-home');
  const wbN=Object.keys(store.wrongs).length;
  const totalN=sectionOrder.reduce((n,k)=>n+sectionQuizData[k].questions.length,0);
  let html='<div class="guide-note">练题模式：<b>每题做完立即显示对错与解析</b>；答错自动加入错题本；错题本中的题<b>连续答对 3 次自动移除</b>。本模式不计入章节评分。</div>';
  html+='<div class="popt" data-kind="all"><div><b>📖 全部题库</b><br><span>第一章 + 第二章 共 '+totalN+' 题</span></div><span class="go">开始 →</span></div>';
  sectionOrder.forEach(k=>{
    const d=sectionQuizData[k];if(!d)return;
    html+='<div class="popt" data-kind="sec" data-sec="'+k+'"><div><b>'+k+' '+esc(d.sectionName)+'</b><br><span>'+d.questions.length+' 题</span></div><span class="go">开始 →</span></div>';
  });
  if(wbN>0)html+='<div class="popt" data-kind="wrong"><div><b>📌 错题本专练</b><br><span>'+wbN+' 题 · 连续答对 3 次自动移除</span></div><span class="go">开始 →</span></div>';
  box.innerHTML=html;
  box.querySelectorAll('.popt').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.kind;
      if(k==='all'){
        const list=sectionOrder.reduce((a,s)=>a.concat(sectionQuizData[s].questions),[]);
        startPractice(list,'全部题库');
      }else if(k==='sec'){
        startPractice(sectionQuizData[el.dataset.sec].questions.slice(),el.dataset.sec+' '+sectionQuizData[el.dataset.sec].sectionName);
      }else{
        const list=Object.keys(store.wrongs).map(x=>JSON.parse(store.wrongs[x]));
        startPractice(list,'错题本专练');
      }
    };
  });
}
function startPractice(list,name){
  if(!list.length){toast('没有题目可练');return;}
  pList=list.slice();pIdx=0;pResults={};pSel={};pRange=name;
  showView('practice');renderPractice();
}
function practiceQ(){return pList[pIdx];}
function renderPractice(){
  const q=practiceQ();if(!q)return;
  const done=pResults[q.id];
  const ca=Array.isArray(q.answer)?q.answer:[q.answer];
  const box=document.getElementById('v-practice');
  let html='<div class="subnav"><button class="bk" id="pBack">← 返回</button><div class="t">练题模式 · '+esc(pRange)+'</div></div>';
  html+='<div class="card">'+
    '<div class="qmeta">'+
      '<span class="tag'+(q.type==='multiple'?' multi':'')+'">'+esc(q.typeLabel)+'</span>'+
      '<span class="tag kp">'+esc(q.knowledgePoint||'')+'</span>'+
      '<span class="tag diff">'+esc(q.difficulty||'')+'</span>'+
      (done?'<span class="tag '+(done.ok?'done':'err')+'">'+(done.ok?'✅ 已答对':'❌ 已答错')+'</span>':'')+
    '</div>'+
    '<div class="qtext">'+esc(q.question)+'</div>';
  const my=done?done.my:(pSel[q.id]||[]);
  html+='<div id="pOptBox">'+q.options.map((o,i)=>{
    let cls='opt';
    if(done){
      if(ca.includes(i))cls+=' ok';else if(my.includes(i))cls+=' bad';
      cls+=' disabled';
    }else if(my.includes(i)){cls+=' sel';}
    return '<div class="'+cls+'" data-i="'+i+'"><div class="no">'+String.fromCharCode(65+i)+'</div><div class="opt-txt">'+esc(o)+'</div></div>';
  }).join('')+'</div>';
  if(q.type==='multiple'&&!done){
    html+='<button class="btn btn-primary" id="pJudge" style="width:100%" disabled>确认判分（多选）</button>';
  }
  if(done){
    const myT=done.my.map(a=>String.fromCharCode(65+a)).join('、');
    const caT=ca.map(a=>String.fromCharCode(65+a)).join('、');
    html+='<div class="judge '+(done.ok?'ok':'bad')+'">'+(done.ok?'✅ 答对了！':'❌ 答错了'+(done.added?'，已加入错题本':'，已更新错题记录'))+
      '<div class="sub">你的答案：'+(myT||'未选')+' ｜ 正确答案：'+caT+'</div></div>'+
      '<div style="margin-top:8px;padding:11px;border-radius:10px;background:#f7f9fc;border-left:4px solid var(--blue);font-size:13.5px;line-height:1.65">'+q.explanation+'</div>';
    if(done.streakTxt)html+='<div class="streak'+(done.streakGood?' good':'')+'">'+done.streakTxt+'</div>';
  }
  html+='</div>';
  html+='<div class="pager">'+
    '<button class="btn btn-ghost" id="pPrev">← 上一题</button>'+
    '<button class="btn btn-primary" id="pNext">'+(pIdx===pList.length-1?'完成练题 →':'下一题 →')+'</button>'+
  '</div>';
  html+='<div class="cnt">第 '+(pIdx+1)+' / '+pList.length+' 题</div>';
  box.innerHTML=html;
  const prev=document.getElementById('pPrev');prev.disabled=pIdx===0;
  prev.onclick=()=>{pIdx--;renderPractice();window.scrollTo(0,0);};
  document.getElementById('pNext').onclick=()=>{if(pIdx<pList.length-1){pIdx++;renderPractice();window.scrollTo(0,0);}else{endPractice();}};
  document.getElementById('pBack').onclick=()=>{showView('practice-home');renderPracticeHome();};
  // 左右滑动切换题目
  box.ontouchstart=e=>{pSx=e.touches[0].clientX;};
  box.ontouchend=e=>{
    if(pSx===null)return;
    const dx=e.changedTouches[0].clientX-pSx;
    if(dx<-45&&pIdx<pList.length-1){pIdx++;renderPractice();window.scrollTo(0,0);}
    else if(dx>45&&pIdx>0){pIdx--;renderPractice();window.scrollTo(0,0);}
    pSx=null;
  };
  if(!done){
    box.querySelectorAll('#pOptBox .opt').forEach(el=>el.onclick=()=>{
      const i=el.dataset.i|0;
      if(q.type==='single'){
        judgePractice(q,[i]);
      }else{
        const sel=pSel[q.id]||[];
        const j=sel.indexOf(i);
        if(j>=0)sel.splice(j,1);else sel.push(i);
        pSel[q.id]=sel;
        renderPractice();
        const jb=document.getElementById('pJudge');
        if(jb)jb.disabled=sel.length<2;
      }
    });
    const jb=document.getElementById('pJudge');
    if(jb)jb.onclick=()=>judgePractice(q,(pSel[q.id]||[]).slice());
  }
}
function judgePractice(q,my){
  const ok=sameAnswer(q,my||[]);
  const inWb=store.wrongs[q.id]!==undefined;
  let added=false,streakTxt='',streakGood=false;
  if(ok){
    if(inWb){
      let w=JSON.parse(store.wrongs[q.id]);
      const st=(w.okStreak||0)+1;
      if(st>=3){
        delete store.wrongs[q.id];save();toast('🎉 连续答对 3 次，已自动移出错题本');
        streakTxt='🎉 连续答对 3 次，本题已自动移出错题本！';streakGood=true;
      }else{
        w.okStreak=st;store.wrongs[q.id]=JSON.stringify(w);save();
        streakTxt='🔥 连续答对 '+st+'/3，再答对 '+(3-st)+' 次将自动移出错题本';
      }
    }
  }else{
    if(inWb){
      const w=JSON.parse(store.wrongs[q.id]);w.okStreak=0;
      store.wrongs[q.id]=JSON.stringify(w);toast('答错，连续答对次数已重置');
    }else{
      store.wrongs[q.id]=JSON.stringify({id:q.id,type:q.type,typeLabel:q.typeLabel,question:q.question,options:q.options,answer:q.answer,explanation:q.explanation,knowledgePoint:q.knowledgePoint,difficulty:q.difficulty,okStreak:0});
      added=true;toast('❌ 答错，已加入错题本');
    }
    save();
  }
  // 记忆功能：记录每次练题作答
  (store.history||(store.history=[])).push({ts:new Date().toISOString(),sec:pRange||'练题',mode:'练题',qid:q.id,type:q.type,my:(my||[]).slice(),ok:ok});
  store.history=store.history.slice(-3000);
  save();
  pResults[q.id]={ok:ok,my:(my||[]).slice(),added:added,streakTxt:streakTxt,streakGood:streakGood};
  delete pSel[q.id];
  renderPractice();
}
function endPractice(){
  const keys=Object.keys(pResults);
  const total=keys.length,ok=keys.filter(k=>pResults[k].ok).length;
  const rest=pList.length-total;
  const rbox=document.getElementById('resultBox');
  rbox.innerHTML='<h2>🏁 练题完成</h2>'+
    '<div class="bigscore '+(rest===0&&ok===total?'pass':(total&&ok/total>=0.6?'':'fail'))+'">'+(total?Math.round(ok/total*100):100)+'<span style="font-size:22px">分</span></div>'+
    '<div class="res-row"><span>范围</span><b>'+esc(pRange)+'</b></div>'+
    '<div class="res-row"><span>已答 / 总题</span><b>'+total+' / '+pList.length+'</b></div>'+
    '<div class="res-row"><span>答对</span><b style="color:var(--ok)">'+ok+'</b></div>'+
    '<div class="res-row"><span>答错</span><b style="color:var(--warn)">'+(total-ok)+'</b></div>'+
    (rest>0?'<div class="res-row"><span>未做</span><b style="color:var(--sub)">'+rest+'</b></div>':'')+
    '<div class="eval"><strong>提示：</strong>'+((total-ok)>0?'答错的题目已收录进错题本，可继续练题巩固，错题连续答对 3 次会自动移除。':'本次答题全部正确！错题本中的题连续答对 3 次会自动移除。')+'</div>'+
    '<div class="res-btns">'+
    (rest>0?'<button class="btn btn-primary" id="eContinue">继续做未答的 '+rest+' 题</button>':'')+
    '<button class="btn btn-primary" id="eAgain">🔄 再练一遍</button>'+
    '<button class="btn btn-ghost" id="eHome">返回练题首页</button>'+
    (Object.keys(store.wrongs).length?'<button class="btn btn-ghost" id="eWb">去错题本（'+Object.keys(store.wrongs).length+' 题）</button>':'')+
    '</div>';
  document.getElementById('overlay').classList.add('show');
  const ec=document.getElementById('eContinue');
  if(ec)ec.onclick=()=>{document.getElementById('overlay').classList.remove('show');const i=pList.findIndex(q=>!pResults[q.id]);if(i>=0){pIdx=i;renderPractice();window.scrollTo(0,0);}};
  document.getElementById('eAgain').onclick=()=>{document.getElementById('overlay').classList.remove('show');startPractice(pList.slice(),pRange);};
  document.getElementById('eHome').onclick=()=>{document.getElementById('overlay').classList.remove('show');showView('practice-home');renderPracticeHome();};
  const ew=document.getElementById('eWb');
  if(ew)ew.onclick=()=>{document.getElementById('overlay').classList.remove('show');renderWrong();showView('wrong');};
}

/* ================= 做题记录（记忆功能） ================= */
function renderRecord(){
  const box=document.getElementById('v-record');
  const hist=store.history||[];
  const total=hist.length;
  const okN=hist.filter(r=>r.ok).length;
  const rate=total?Math.round(okN/total*100):0;
  let html='<div class="guide-note">📋 做题记录：章节作答与练题判分每次都会记录在本机，用于回顾与统计正确率。记录仅存于浏览器本地。</div>';
  html+='<div class="card"><div style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap">'+
    '<div style="flex:1;min-width:80px;text-align:center"><div style="font-size:24px;font-weight:800;color:var(--blue)">'+total+'</div><div style="font-size:11.5px;color:var(--sub)">累计作答</div></div>'+
    '<div style="flex:1;min-width:80px;text-align:center"><div style="font-size:24px;font-weight:800;color:var(--ok)">'+okN+'</div><div style="font-size:11.5px;color:var(--sub)">答对</div></div>'+
    '<div style="flex:1;min-width:80px;text-align:center"><div style="font-size:24px;font-weight:800;color:'+(rate>=80?'var(--ok)':rate>=60?'#e6a23c':'var(--warn)')+'">'+rate+'%</div><div style="font-size:11.5px;color:var(--sub)">正确率</div></div>'+
  '</div></div>';
  if(!total){
    html+='<div class="empty"><div class="ico">📋</div>还没有做题记录。完成一次章节作答或练题判分后，这里会自动记录每次答题情况。</div>';
  }else{
    html+='<div style="margin:12px 12px 2px;font-size:12.5px;color:var(--sub);font-weight:600">最近记录（倒序）</div>';
    hist.slice().reverse().forEach(r=>{
      const myT=(r.my||[]).map(a=>String.fromCharCode(65+a)).join('、');
      const tm=new Date(r.ts);
      const pad=n=>String(n).padStart(2,'0');
      const badTm=isNaN(tm.getTime());
      const tsTxt=badTm?'--':pad(tm.getMonth()+1)+'-'+pad(tm.getDate())+' '+pad(tm.getHours())+':'+pad(tm.getMinutes());
      html+='<div class="wb-item" style="border-left-color:'+(r.ok?'var(--ok)':'var(--warn)')+'">'+
        '<div class="from">'+tsTxt+' · '+(r.mode||'')+' · '+esc(String(r.sec||''))+' · 第 '+esc(String(r.qid||'').split('-').pop())+' 题 · '+(r.type==='multiple'?'多选':'单选')+'</div>'+
        '<div class="ans" style="color:'+(r.ok?'var(--ok)':'var(--warn)')+'">'+(r.ok?'✅ 答对':'❌ 答错')+' · 你的答案：'+(myT||'未选')+'</div></div>';
    });
    html+='<div style="margin:12px"><button class="btn btn-ghost" id="clearHist" style="width:100%">🗑 清空做题记录</button></div>';
  }
  box.innerHTML=html;
  const cb=document.getElementById('clearHist');
  if(cb)cb.onclick=()=>{if(confirm('确定清空全部做题记录？')){store.history=[];save();renderRecord();toast('做题记录已清空');}};
}

/* ================= 视图切换 ================= */
function showView(v){
  const sub=v==='wrong-detail'||v==='practice';
  if(v==='practice'&&!pList.length){toast('请先在练题页选择范围');showView('practice-home');return;}
  if(v==='wrong-detail'&&!wbList.length){showView('wrong');return;}
  if(v==='quiz'&&!curQ()){toast('请先在章节页选择一节');showView('home');return;}
  view=v;
  document.querySelector('header').style.display=sub?'none':'';
  document.querySelector('.tabs').style.display=sub?'none':'';
  document.getElementById('v-home').style.display=v==='home'?'':'none';
  document.getElementById('v-quiz').style.display=v==='quiz'?'':'none';
  document.getElementById('v-practice-home').style.display=v==='practice-home'?'':'none';
  document.getElementById('v-practice').style.display=v==='practice'?'':'none';
  document.getElementById('v-wrong').style.display=v==='wrong'?'':'none';
  document.getElementById('v-wrong-detail').style.display=v==='wrong-detail'?'':'none';
  document.getElementById('v-record').style.display=v==='record'?'':'none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  store.lastView=v;save();
  if(v==='home')renderHome();
  if(v==='wrong')renderWrong();
  if(v==='practice-home')renderPracticeHome();
  if(v==='record')renderRecord();
  if(v==='quiz')renderQuiz();
  window.scrollTo(0,0);
}

/* ================= 事件 ================= */
document.getElementById('prevBtn').onclick=()=>{if(curIdx>0){curIdx--;renderQuiz();window.scrollTo(0,0);}};
document.getElementById('nextBtn').onclick=()=>{
  const list=curList();
  // 允许直接翻页
  if(curIdx<list.length-1){curIdx++;renderQuiz();window.scrollTo(0,0);}
  else{finishSection();}
};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));

/* ================= 初始化 ================= */
renderHome();
showView(store.lastView||'home');
// 子页面状态刷新后不可用则自动回退（showView 内部已处理）；练习页无 curSec 时回首页
if(view==='quiz'&&!curQ())showView('home');

/* ================= PWA 离线缓存 ================= */
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
</script>
